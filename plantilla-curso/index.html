<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nombre del curso</title>
  <!-- Opcional: estilos y componentes de academia. Puedes quitarlos y usar lo tuyo. -->
  <link rel="stylesheet" href="https://academia.tecnocooperativa.cl/kit/academia.css">
  <script type="module" src="https://academia.tecnocooperativa.cl/kit/academia-kit.js"></script>
</head>
<body>
  <main class="ac-pagina">
    <nav class="ac-migas"><a href="https://academia.tecnocooperativa.cl">academia</a> › Nombre del curso</nav>
    <header class="ac-cabecera">
      <h1>Nombre del curso</h1>
      <p class="ac-bajada">Qué se aprende aquí, en una frase.</p>
    </header>

    <p>Texto del curso. Usa <code>.ac-nota</code> para comentarios al margen, <code>.ac-ejercicio</code> para pruebas y <code>.ac-laboratorio</code> para agrupar controles.</p>

    <div class="ac-nota"><p>Una nota al margen.</p></div>

    <div class="ac-laboratorio">
      <div class="ac-controles">
        <ac-perilla etiqueta="Frecuencia" min="55" max="1760" valor="220" escala="log" unidad="Hz" for="osc" atributo="frecuencia"></ac-perilla>
        <ac-oscilador id="osc"></ac-oscilador>
      </div>
      <ac-osciloscopio for="osc"></ac-osciloscopio>
    </div>

    <div class="ac-ejercicio"><p>Un ejercicio para quien lee.</p></div>
  </main>
</body>
</html>
