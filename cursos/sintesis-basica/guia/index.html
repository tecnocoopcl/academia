.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"369.7545913816437\" y=\"75.9685039370079\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,151) scale(1,-1)\">VCA</text><polyline points=\"76.53543 77.95276, 94.96063 77.95276, 94.96063 111.9685, 108.8504 111.9685\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"113.3858 111.9685, 107.7165 114.8031, 107.7165 109.1339\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><polyline points=\"76.53543 66.61417, 94.96063 66.61417, 94.96063 32.59843, 108.8504 32.59843\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"113.3858 32.59843, 107.7165 35.43307, 107.7165 29.76378\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><polyline points=\"189.9213 111.9685, 208.3465 111.9685, 208.3465 80.7874, 222.2362 80.7874\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"226.7717 80.7874, 221.1024 83.62205, 221.1024 77.95276\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><polyline points=\"189.9213 32.59843, 208.3465 32.59843, 208.3465 63.77953, 222.2362 63.77953\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"226.7717 63.77953, 221.1024 66.61417, 221.1024 60.94488\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><polyline points=\"303.3071 72.28346, 321.7323 72.28346, 321.7323 72.28346, 335.622 72.28346\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"340.1575 72.28346, 334.4882 75.11811, 334.4882 69.44882\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/></g></g></svg>\n</div><figcaption>Fig. 6. Filtros en paralelo. El balance del hardware es la proporción entre los dos canales del mixer final.</figcaption></figure>\n<h4>Traducción de parámetros</h4>\n<div class=\"tablewrap\"><table><thead><tr><th>Parámetro de hardware</th><th>Equivalente en VCV</th></tr></thead><tbody><tr><td>Filter type</td><td>Salida LPF/HPF del VCF o modo del VCF de Bogaudio</td></tr><tr><td>Frequency / Resonance</td><td>FREQ / RES del VCF</td></tr><tr><td>Drive</td><td>DRIVE del VCF</td></tr><tr><td>Key track</td><td>V/Oct + envolvente en un mixer → FREQ del VCF; nivel 0–100 %</td></tr><tr><td>Env 2 depth</td><td>Nivel de ADSR 2 en ese mixer; signo con el atenuverter FREQ CV</td></tr><tr><td>Routing / Balance</td><td>Cableado serie/paralelo + mixer final</td></tr><tr><td>Freq link / Res link</td><td>Una misma CV → ambos VCF (Ctrl+clic para duplicar el cable)</td></tr></tbody></table></div>"}, {"n": 5, "kick": "CONTORNO", "title": "Envolventes", "html": "<p>Una envolvente es un voltaje que describe cómo cambia un parámetro durante la vida de una nota. El gate la dispara y su forma depende de cuatro etapas.</p>\n<h3>ADSR</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Etapa</th><th>Qué controla</th><th>Parámetro</th></tr></thead><tbody><tr><td>Attack</td><td>Tiempo desde 0 hasta el máximo tras el gate on</td><td>Tiempo</td></tr><tr><td>Decay</td><td>Tiempo desde el máximo hasta el nivel de sustain</td><td>Tiempo</td></tr><tr><td>Sustain</td><td>Nivel mantenido mientras el gate siga activo</td><td>Nivel</td></tr><tr><td>Release</td><td>Tiempo desde el nivel actual hasta 0 tras el gate off</td><td>Tiempo</td></tr></tbody></table></div>\n<p>Tres de los cuatro parámetros son tiempos y uno es un nivel. Ese detalle explica la mayoría de las confusiones: subir sustain no alarga la nota, la mantiene más fuerte mientras sostienes la tecla.</p>\n<h4>Formas de referencia</h4>\n<div class=\"tablewrap\"><table><thead><tr><th>Sonido</th><th>A</th><th>D</th><th>S</th><th>R</th></tr></thead><tbody><tr><td>Órgano</td><td>0</td><td>—</td><td>máx.</td><td>corto</td></tr><tr><td>Pluck / bajo percusivo</td><td>0</td><td>corto</td><td>0</td><td>corto</td></tr><tr><td>Piano / campana</td><td>0</td><td>largo</td><td>0</td><td>medio</td></tr><tr><td>Pad / cuerdas</td><td>largo</td><td>medio</td><td>alto</td><td>largo</td></tr><tr><td>Brass</td><td>medio</td><td>corto</td><td>medio-alto</td><td>medio</td></tr></tbody></table></div>\n<p><b>ADSR</b> (Fundamental) tiene entradas CV para cada etapa, entrada GATE y entrada RETRIG. Esas entradas CV permiten todo lo que el hardware llama “tracking”.</p>\n<h3>Velocity</h3>\n<p>Velocity mide la fuerza con que tocas. MIDI-CV la entrega en VEL (0–10 V). Para que la velocity controle el volumen, multiplica la envolvente por VEL: ADSR → entrada del VCA, VEL → CV del VCA, y el VCA resultante como CV del VCA de audio. Una alternativa más directa: VEL hacia la entrada CV de un segundo VCA en serie. Para que la velocity controle el brillo, VEL → FREQ CV del VCF con un atenuador moderado.</p>\n<h3>Tracking de envolvente</h3>\n<p>En instrumentos acústicos las notas agudas decaen más rápido que las graves. El tracking reproduce ese comportamiento: la posición en el teclado modifica los tiempos de la envolvente. En VCV, conecta la V/Oct a la entrada CV de DECAY del ADSR con el atenuverter negativo: cuanto más aguda la nota, más corto el decay. La nota de referencia es el punto donde la V/Oct vale 0 V (C4); para mover la referencia, suma un offset.</p>\n<h3>Retrigger y legato</h3>\n<p>En modo multi-trigger cada nota reinicia la envolvente completa. En legato, solo la primera nota de una frase dispara la envolvente; las siguientes notas ligadas cambian el pitch sin reiniciar el contorno. En VCV, MIDI-CV entrega un pulso en RTRG para cada nota nueva: conéctalo a la entrada RETRIG del ADSR para multi-trigger, o déjalo desconectado y usa un solo canal (monofónico) para legato. Glide (portamento) se obtiene pasando la V/Oct por un módulo de slew.</p>\n<h3>Envolventes en loop</h3>\n<p>Una envolvente que se repite antes de llegar al sustain produce sonidos rítmicos o de “aleteo”. El hardware lo llama repeat. En VCV, un generador de funciones con modo cycle cumple esa función: <b>Rampage</b> (Befaco) con CYCLE activo se comporta como un LFO cuya forma defines con rise y fall. También sirve como envolvente AR clásica cuando el ciclo está apagado.</p>\n<h3>Envolventes adicionales</h3>\n<p>El hardware tiene dos envolventes dedicadas (amplitud y filtro) y cuatro asignables vía matriz. En VCV agrega tantos ADSR como necesites. El gate de MIDI-CV alimenta a todos: Ctrl+clic sobre la salida GATE para cada cable nuevo. Una tercera envolvente hacia la POS del WT VCO, o hacia la FM del VCO para un “pitch drop” en el ataque, es un buen comienzo.</p>\n<h4>Delay de envolvente</h4>\n<p>Un delay retrasa el inicio de la envolvente. Útil para que una modulación aparezca solo en notas sostenidas. <b>DADSR(H)</b> de Bogaudio incluye la etapa de delay; en Fundamental puedes aproximarlo con un ADSR de ataque largo multiplicado (VCA) por otro.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Parámetro de hardware</th><th>Equivalente en VCV</th></tr></thead><tbody><tr><td>Attack / Decay / Sustain / Release</td><td>Perillas A D S R del ADSR</td></tr><tr><td>Velocity</td><td>VEL de MIDI-CV → CV de un VCA en serie</td></tr><tr><td>Attack track / Decay track</td><td>V/Oct → CV de ATTACK / DECAY con atenuverter</td></tr><tr><td>Level track</td><td>V/Oct → CV de un VCA, atenuverter ±</td></tr><tr><td>Multi-trigger / Legato</td><td>RTRG → RETRIG del ADSR, o sin RETRIG en modo mono</td></tr><tr><td>Repeat</td><td>Rampage (Befaco) en modo CYCLE</td></tr><tr><td>Envelope delay</td><td>DADSRH (Bogaudio)</td></tr><tr><td>Attack / Decay slope</td><td>Curvas del generador (Rampage tiene SHAPE)</td></tr></tbody></table></div>"}, {"n": 6, "kick": "MOVIMIENTO", "title": "LFOs", "html": "<p>Un LFO (low frequency oscillator) es un oscilador por debajo del rango audible, normalmente 0,01–20 Hz. No se escucha; se usa como fuente de modulación cíclica.</p>\n<h3>Destino y efecto</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Destino</th><th>Efecto</th><th>Onda / velocidad típica</th></tr></thead><tbody><tr><td>Pitch del VCO</td><td>Vibrato</td><td>Seno o triángulo, 4–7 Hz, profundidad pequeña</td></tr><tr><td>Cutoff del VCF</td><td>Wah, barrido</td><td>Triángulo o seno, lento</td></tr><tr><td>CV del VCA</td><td>Trémolo</td><td>Seno, 3–8 Hz</td></tr><tr><td>PWM</td><td>Pulso que respira</td><td>Triángulo, 0,1–1 Hz</td></tr><tr><td>Pitch, onda cuadrada</td><td>Trino entre dos notas</td><td>Cuadrada, profundidad = intervalo</td></tr><tr><td>Cutoff, sample &amp; hold</td><td>Notas aleatorias de filtro</td><td>Random sincronizado a tempo</td></tr><tr><td>POS del WT VCO</td><td>Timbre que evoluciona</td><td>Muy lento</td></tr></tbody></table></div>\n<p><b>LFO</b> (Fundamental) entrega SIN, TRI, SAW y SQR, tiene entrada FM, PW para la cuadrada, entrada RESET y switches de offset (unipolar/bipolar) e inversión. <b>Random</b> cubre sample &amp; hold y ruido suavizado.</p>\n<h4>Bipolar y unipolar</h4>\n<p>Un LFO bipolar (±5 V) mueve el destino hacia arriba y hacia abajo del valor de la perilla. Un LFO unipolar (0–10 V) solo lo mueve hacia un lado. Para vibrato, bipolar; para un trémolo que nunca supere el volumen base, unipolar e invertido.</p>\n<h3>Fade in, fade out, gate in, gate out</h3>\n<p>El hardware puede retrasar o desvanecer la acción del LFO. El vibrato que entra después de sostener la nota es el ejemplo clásico. En VCV la técnica es una multiplicación: LFO → entrada de un VCA, envolvente → CV del VCA.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Modo</th><th>Envolvente que controla el VCA</th></tr></thead><tbody><tr><td>Fade in</td><td>ADSR con attack largo, sustain máx. El LFO crece gradualmente</td></tr><tr><td>Gate in</td><td>ADSR con delay (DADSRH) y attack 0. El LFO aparece de golpe tras un tiempo</td></tr><tr><td>Fade out</td><td>ADSR con attack 0, decay largo, sustain 0. El LFO se desvanece</td></tr><tr><td>Gate out</td><td>Envolvente con attack 0, decay casi nulo tras un tiempo fijo (DADSRH: hold)</td></tr></tbody></table></div>\n<figure class=\"fig\"><div class=\"figscroll\"><svg class=\"fig-svg\" role=\"img\" aria-label=\"Fig. 7. Vibrato con fade in. El gate de MIDI-CV dispara el ADSR; el VCA multiplica LFO × envolvente.\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 453 113\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><clipPath id=\"clip8\"><rect x=\"0\" y=\"0\" width=\"453.5433070866142\" height=\"113.38582677165356\"/></clipPath><g id=\"group\" transform=\"scale(1,-1) translate(0,-113)\" style=\"clip-path: url(#clip8)\"><g transform=\"\"><rect x=\"0.0\" y=\"76.53543307086615\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"30.020157941683074\" y=\"98.64566929133859\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,197) scale(1,-1)\">LFO</text><text x=\"25.799357160433072\" y=\"83.90551181102363\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,167) scale(1,-1)\">SIN 5 Hz</text><rect x=\"0.0\" y=\"2.8346456692913335\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"26.509611066683075\" y=\"24.944881889763778\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,49) scale(1,-1)\">ADSR</text><text x=\"27.794352277620572\" y=\"10.204724409448815\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,20) scale(1,-1)\">A largo</text><rect x=\"119.05511811023624\" y=\"42.519685039370074\" width=\"76.53543307086616\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"148.6522291769193\" y=\"64.62992125984252\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,129) scale(1,-1)\">VCA</text><rect x=\"238.11023622047247\" y=\"42.519685039370074\" width=\"76.53543307086613\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"267.41789416215556\" y=\"64.62992125984252\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,129) scale(1,-1)\">VCO</text><text x=\"272.13588732621804\" y=\"49.889763779527556\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,99) scale(1,-1)\">FM</text><polyline points=\"76.53543 94.96063, 97.79528 94.96063, 97.79528 66.61417, 114.5197 66.61417\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"119.0551 66.61417, 113.3858 69.44882, 113.3858 63.77953\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><text x=\"100.62992125984253\" y=\"83.62204724409449\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--cv); stroke:none;\" transform=\"translate(0,167) scale(1,-1)\">IN</text><polyline points=\"76.53543 21.25984, 97.79528 21.25984, 97.79528 55.27559, 114.5197 55.27559\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"119.0551 55.27559, 113.3858 58.11024, 113.3858 52.44094\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><text x=\"100.62992125984253\" y=\"41.10236220472441\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--cv); stroke:none;\" transform=\"translate(0,82) scale(1,-1)\">CV</text><polyline points=\"195.5906 60.94488, 216.8504 60.94488, 216.8504 60.94488, 233.5748 60.94488\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"238.1102 60.94488, 232.4409 63.77953, 232.4409 58.11024\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><text x=\"206.86713751845477\" y=\"64.62992125984252\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--cv); stroke:none;\" transform=\"translate(0,129) scale(1,-1)\">FM</text></g></g></svg>\n</div><figcaption>Fig. 7. Vibrato con fade in. El gate de MIDI-CV dispara el ADSR; el VCA multiplica LFO × envolvente.</figcaption></figure>\n<h3>Sincronización</h3>\n<p>Un LFO sincronizado a tempo produce modulación rítmica: un filtro que se abre cada negra, un trémolo en corcheas. En VCV, un reloj maestro (<b>Clocked</b> de Impromptu, o CLK de MIDI-CV si el tempo viene del DAW) alimenta la entrada RESET del LFO. Con la frecuencia del LFO ajustada cerca del tempo, el reset alinea la fase en cada pulso.</p>\n<h4>Key sync y LFO por voz</h4>\n<p>Con key sync, el LFO reinicia su fase en cada nota: todas las notas empiezan la modulación igual. Sin key sync, el LFO corre libre y cada nota cae en un punto distinto del ciclo. En VCV conecta el gate (o RTRG) a RESET para key sync. Con un cable polifónico en RESET, el LFO de Fundamental genera un LFO independiente por voz.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Parámetro de hardware</th><th>Equivalente en VCV</th></tr></thead><tbody><tr><td>Waveform</td><td>Salida SIN/TRI/SAW/SQR del LFO; Random para S&amp;H</td></tr><tr><td>Rate</td><td>FREQ del LFO</td></tr><tr><td>Rate sync</td><td>Reloj → RESET; o LFO con entrada de clock</td></tr><tr><td>Key sync / Phase</td><td>Gate → RESET</td></tr><tr><td>Delay + Fade in/out, Gate in/out</td><td>LFO × envolvente en un VCA</td></tr><tr><td>Delay trigger: legato / re-trig</td><td>Envolvente que controla el VCA con o sin RETRIG</td></tr><tr><td>Slew</td><td>Módulo de slew a la salida del LFO</td></tr></tbody></table></div>"}, {"n": 7, "kick": "CONTROL", "title": "La matriz de modulación", "html": "<p>El hardware define la modulación como slots: cada slot conecta una o dos fuentes con un destino y fija una profundidad. Cuando un slot tiene dos fuentes, sus valores se <b>multiplican</b>; si cualquiera vale cero, no hay modulación. Cuando varios slots apuntan al mismo destino, sus efectos se <b>suman</b>. Esas dos reglas describen todo lo que hace una matriz de modulación, y ambas tienen un módulo directo en VCV.</p>\n<h3>Anatomía de un slot</h3>\n<figure class=\"fig\"><div class=\"figscroll\"><svg class=\"fig-svg\" role=\"img\" aria-label=\"Fig. 8. Un slot de la matriz en VCV. Con una sola fuente, omite el VCA. Muchas entradas CV ya tienen atenuverter propio y hacen innecesario el 8vert.\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 453 113\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><clipPath id=\"clip9\"><rect x=\"0\" y=\"0\" width=\"453.5433070866142\" height=\"113.38582677165356\"/></clipPath><g id=\"group\" transform=\"scale(1,-1) translate(0,-113)\" style=\"clip-path: url(#clip9)\"><g transform=\"\"><rect x=\"0.0\" y=\"76.53543307086615\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"19.323380597933074\" y=\"98.64566929133859\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,197) scale(1,-1)\">Fuente 1</text><text x=\"25.28512376199557\" y=\"83.90551181102363\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,167) scale(1,-1)\">p.ej. LFO</text><rect x=\"0.0\" y=\"8.503937007874015\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"19.323380597933074\" y=\"30.61417322834646\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,61) scale(1,-1)\">Fuente 2</text><text x=\"15.05519212137057\" y=\"15.874015748031496\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,31) scale(1,-1)\">p.ej. Mod wheel</text><rect x=\"113.38582677165356\" y=\"42.519685039370074\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"142.98293783833662\" y=\"64.62992125984252\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,129) scale(1,-1)\">VCA</text><text x=\"135.96006186177414\" y=\"49.889763779527556\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,99) scale(1,-1)\">multiplicar</text><rect x=\"226.7716535433071\" y=\"42.519685039370074\" width=\"76.53543307086616\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"253.6505028912402\" y=\"64.62992125984252\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,129) scale(1,-1)\">8vert</text><text x=\"243.71668941467772\" y=\"49.889763779527556\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,99) scale(1,-1)\">profundidad ±</text><rect x=\"340.15748031496065\" y=\"42.519685039370074\" width=\"76.53543307086613\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"361.99687653789374\" y=\"64.62992125984252\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,129) scale(1,-1)\">Destino</text><text x=\"361.8674575925812\" y=\"49.889763779527556\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,99) scale(1,-1)\">entrada CV</text><polyline points=\"76.53543 94.96063, 94.96063 94.96063, 94.96063 66.61417, 108.8504 66.61417\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"113.3858 66.61417, 107.7165 69.44882, 107.7165 63.77953\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><text x=\"97.79527559055119\" y=\"83.62204724409449\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--cv); stroke:none;\" transform=\"translate(0,167) scale(1,-1)\">IN</text><polyline points=\"76.53543 26.92913, 94.96063 26.92913, 94.96063 55.27559, 108.8504 55.27559\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"113.3858 55.27559, 107.7165 58.11024, 107.7165 52.44094\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><text x=\"97.79527559055119\" y=\"43.93700787401575\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--cv); stroke:none;\" transform=\"translate(0,87) scale(1,-1)\">CV</text><polyline points=\"189.9213 60.94488, 208.3465 60.94488, 208.3465 60.94488, 222.2362 60.94488\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"226.7717 60.94488, 221.1024 63.77953, 221.1024 58.11024\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><polyline points=\"303.3071 60.94488, 321.7323 60.94488, 321.7323 60.94488, 335.622 60.94488\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"340.1575 60.94488, 334.4882 63.77953, 334.4882 58.11024\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/></g></g></svg>\n</div><figcaption>Fig. 8. Un slot de la matriz en VCV. Con una sola fuente, omite el VCA. Muchas entradas CV ya tienen atenuverter propio y hacen innecesario el 8vert.</figcaption></figure>\n<div class=\"tablewrap\"><table><thead><tr><th>Concepto de la matriz</th><th>Implementación en VCV</th></tr></thead><tbody><tr><td>Fuente</td><td>Cualquier salida: LFO, ADSR, MIDI-CV (VEL, AFT, MW, PW), Random, secuenciador</td></tr><tr><td>Fuente 1 × Fuente 2</td><td>VCA: una fuente en la entrada, la otra en CV. Bipolar × bipolar: A*B+C</td></tr><tr><td>Profundidad (depth)</td><td>Atenuverter de la entrada o 8vert</td></tr><tr><td>Varios slots al mismo destino</td><td>Mixer o Sum antes de la entrada</td></tr><tr><td>Destino</td><td>Cualquier entrada CV del rack</td></tr></tbody></table></div>\n<h3>Los cuatro casos del manual</h3>\n<p>El hardware ilustra la diferencia entre multiplicar y sumar con LFO y mod wheel:</p>\n<ul><li><b>Un slot, LFO × mod wheel, rueda arriba:</b> vibrato completo.</li><li><b>Un slot, LFO × mod wheel, rueda abajo:</b> ningún vibrato. La rueda actúa como control de profundidad.</li><li><b>Dos slots, LFO y mod wheel por separado, rueda abajo:</b> vibrato completo. La rueda desplaza el pitch, no controla el vibrato.</li><li><b>Dos slots, rueda arriba:</b> vibrato completo y el pitch desplazado hacia arriba por la rueda.</li></ul>\n<p>En VCV el primer par es Fig. 8 con LFO y MW. El segundo par usa un mixer: LFO y MW entran en canales separados y la suma va a la FM del VCO.</p>\n<h3>Fuentes de expresión desde MIDI-CV</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Salida</th><th>Rango</th><th>Destinos útiles</th></tr></thead><tbody><tr><td>VEL</td><td>0–10 V</td><td>Volumen (VCA), brillo (cutoff), ataque más corto</td></tr><tr><td>AFT</td><td>0–10 V</td><td>Vibrato, cutoff, profundidad de LFO</td></tr><tr><td>MW</td><td>0–10 V</td><td>Profundidad de vibrato, cutoff, POS de wavetable</td></tr><tr><td>PW</td><td>±5 V</td><td>Pitch bend; también cutoff o mezcla</td></tr><tr><td>MIDI-CC (módulo aparte)</td><td>0–10 V</td><td>Perillas físicas de tu controlador → cualquier destino</td></tr></tbody></table></div>\n<aside class=\"note\"><strong class=\"lbl\">Tip</strong> Una matriz admite combinaciones que se pisan entre sí. Agrega una modulación a la vez y escucha el resultado antes de sumar la siguiente. El Scope en la entrada del destino muestra el voltaje total que recibe.</aside>\n<h4>Mapeo de perillas</h4>\n<p>La función de “animate touch” del hardware asigna perillas físicas a parámetros. En VCV, <b>MIDI-Map</b> (Core) asigna cualquier CC de tu controlador a cualquier perilla del rack sin cables: haz clic en un slot de MIDI-Map, luego en la perilla destino, y mueve la perilla física.</p>"}, {"n": 8, "kick": "NOTAS", "title": "Arpegiador y acordes", "html": "<p>El arpegiador convierte las notas sostenidas en una secuencia: toca un acorde y el arp lo reproduce nota a nota al ritmo de un reloj. El chorder hace lo inverso: una sola tecla dispara un acorde completo. En el hardware el arp va antes del chorder, de modo que se arpegia el acorde completo resultante.</p>\n<h3>Reloj</h3>\n<p>Todo lo rítmico en VCV necesita un reloj. <b>Clocked</b> (Impromptu) genera un reloj maestro con BPM y salidas con multiplicación y división. Si tocas sobre un DAW, el reloj MIDI llega por CLK de MIDI-CV. El tempo del hardware (ClockBPM) es la perilla BPM del reloj maestro.</p>\n<h3>Arpegiador con módulos de Fundamental</h3>\n<p>La polifonía de VCV permite construir un arp simple sin plugins externos. MIDI-CV entrega las notas sostenidas en un cable polifónico. <b>Split</b> separa los canales; un <b>Sequential Switch</b> 4→1 avanza por ellos en cada pulso del reloj. La salida es una V/Oct monofónica que recorre el acorde en orden ascendente (Up). El gate del arp sale del mismo reloj, pasado por un ADSR corto.</p>\n<figure class=\"fig\"><div class=\"figscroll\"><svg class=\"fig-svg\" role=\"img\" aria-label=\"Fig. 9. Arpegiador Up de hasta cuatro notas. Con MIDI-CV en modo Reset, los canales se ordenan de forma estable.\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 453 124\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><clipPath id=\"clip10\"><rect x=\"0\" y=\"0\" width=\"453.5433070866142\" height=\"124.7244094488189\"/></clipPath><g id=\"group\" transform=\"scale(1,-1) translate(0,-124)\" style=\"clip-path: url(#clip10)\"><g transform=\"\"><rect x=\"0.0\" y=\"87.8740157480315\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"21.197404035433074\" y=\"109.98425196850394\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,219) scale(1,-1)\">MIDI-CV</text><text x=\"24.174552472933073\" y=\"95.24409448818898\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,190) scale(1,-1)\">4 canales</text><rect x=\"93.54330708661418\" y=\"87.8740157480315\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"121.93250799704725\" y=\"109.98425196850394\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,219) scale(1,-1)\">Split</text><rect x=\"187.08661417322836\" y=\"87.8740157480315\" width=\"76.53543307086616\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"200.22942836491143\" y=\"109.98425196850394\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,219) scale(1,-1)\">Seq. Switch</text><text x=\"219.1287935992864\" y=\"95.24409448818898\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,190) scale(1,-1)\">4→1</text><rect x=\"93.54330708661418\" y=\"14.173228346456682\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"115.03201971579726\" y=\"36.283464566929126\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,72) scale(1,-1)\">Clocked</text><text x=\"115.40452948142226\" y=\"21.543307086614163\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,43) scale(1,-1)\">Impromptu</text><rect x=\"280.62992125984255\" y=\"87.8740157480315\" width=\"76.53543307086613\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"295.7822081077756\" y=\"109.98425196850394\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,219) scale(1,-1)\">VCO → VCF</text><rect x=\"280.62992125984255\" y=\"14.173228346456682\" width=\"76.53543307086613\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"307.1395323265256\" y=\"36.283464566929126\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,72) scale(1,-1)\">ADSR</text><text x=\"311.2964903343381\" y=\"21.543307086614163\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,43) scale(1,-1)\">corto</text><rect x=\"377.0078740157481\" y=\"87.8740157480315\" width=\"76.53543307086613\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"406.60498508243114\" y=\"109.98425196850394\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,219) scale(1,-1)\">VCA</text><polyline points=\"76.53543 106.2992, 85.03937 106.2992, 85.03937 106.2992, 89.00787 106.2992\" style=\"stroke: var(--poly); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"93.  y=\"109.98425196850394\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--cv); stroke:none;\" transform=\"translate(0,219) scale(1,-1)\">V/Oct</text><polyline points=\"170.0787 32.59843, 225.3543 32.59843, 225.3543 32.59843, 276.0945 32.59843\" style=\"stroke: var(--gate); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"280.6299 32.59843, 274.9606 35.43307, 274.9606 29.76378\" style=\"stroke: var(--gate); stroke-linecap: butt; stroke-width: 0.1; fill: var(--gate); fill-rule: evenodd;\"/><text x=\"211.58005890132878\" y=\"36.283464566929126\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--gate); stroke:none;\" transform=\"translate(0,72) scale(1,-1)\">GATE</text><polyline points=\"357.1654 106.2992, 367.0866 106.2992, 367.0866 106.2992, 372.4724 106.2992\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"377.0079 106.2992, 371.3386 109.1339, 371.3386 103.4646\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><polyline points=\"357.1654 32.59843, 365.6693 32.59843, 365.6693 97.79528, 372.4724 97.79528\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"377.0079 97.79528, 371.3386 100.6299, 371.3386 94.96063\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><text x=\"368.503937007874\" y=\"68.03149606299212\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--cv); stroke:none;\" transform=\"translate(0,136) scale(1,-1)\">CV</text></g></g></svg>\n</div><figcaption>Fig. 9. Arpegiador Up de hasta cuatro notas. Con MIDI-CV en modo Reset, los canales se ordenan de forma estable.</figcaption></figure>\n<p>Modos de arpegio (down, up/down, random) y patrones de duración requieren más lógica. La Library tiene arpegiadores dedicados; busca “arpeggiator”. El ejercicio de construirlo a mano, sin embargo, deja claro qué hace un arp: un contador que indexa notas.</p>\n<h4>Octavas y swing</h4>\n<p>El rango de octavas del arp suma 1 V por octava a cada ciclo. <b>Octave</b> (Fundamental) desplaza una V/Oct en octavas enteras; un segundo Sequential Switch o un secuenciador de CV puede alternar el desplazamiento. El swing retrasa los pulsos pares del reloj: Clocked tiene control de swing.</p>\n<h3>Chorder: acordes desde una tecla</h3>\n<p>Un acorde es la misma V/Oct más offsets fijos: mayor = 0, 4/12, 7/12 V; menor = 0, 3/12, 7/12 V; séptima menor agrega 10/12 V. En VCV, toma la V/Oct de una voz, súmale cada offset con un módulo de offset con display y combina los resultados con <b>Merge</b> en un cable polifónico. El VCO polifónico recibe ese cable y suena el acorde. Pasar cada voz por un <b>Quantizer</b> (Fundamental) corrige errores de redondeo en los offsets.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Acorde</th><th>Intervalos (semitonos)</th><th>Offsets V/Oct</th></tr></thead><tbody><tr><td>Mayor</td><td>0 · 4 · 7</td><td>0 · 0,333 · 0,583</td></tr><tr><td>Menor</td><td>0 · 3 · 7</td><td>0 · 0,250 · 0,583</td></tr><tr><td>Séptima de dominante</td><td>0 · 4 · 7 · 10</td><td>+ 0,833</td></tr><tr><td>Menor séptima</td><td>0 · 3 · 7 · 10</td><td>+ 0,833</td></tr><tr><td>Sus4</td><td>0 · 5 · 7</td><td>0 · 0,417 · 0,583</td></tr><tr><td>Quinta (power chord)</td><td>0 · 7 · 12</td><td>0 · 0,583 · 1,000</td></tr></tbody></table></div>\n<p>La notación del hardware cuenta semitonos sobre la nota más baja: la tercera mayor aparece como 4 porque está 4 semitonos sobre la fundamental; la quinta, como 7. Es exactamente la columna de semitonos de la tabla.</p>"}, {"n": 9, "kick": "PROCESAMIENTO", "title": "Efectos", "html": "<p>Los efectos operan sobre la voz completa después del VCA. En el hardware ocupan slots con routing configurable en serie o paralelo; en VCV es una cadena de módulos que cableas en el orden que quieras.</p>\n<h4>Orden típico</h4>\n<p>Distorsión → EQ → compresor → chorus/phaser → delay → reverb. La distorsión primero, porque los efectos de tiempo después de ella suenan más limpios. La reverb al final, porque reverberar una distorsión de reverb produce barro. Cambiar el orden es parte del juego, no un error.</p>\n<h3>Distorsión</h3>\n<p>La distorsión hace pasar la señal por una transferencia no lineal; la forma de esa transferencia define qué armónicos aparecen. Cada tipo del hardware corresponde a una curva.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Tipo</th><th>Mecanismo</th><th>En VCV</th></tr></thead><tbody><tr><td>Diode / Valve</td><td>Saturación suave y progresiva</td><td>DRIVE del VCF; waveshapers de la Library</td></tr><tr><td>Clipper</td><td>Recorte duro en un umbral</td><td>Un VCA con ganancia &gt; 1 seguido de un limitador</td></tr><tr><td>Rectify</td><td>Invierte los semiciclos negativos</td><td>Rectificador (busca “rectifier”); duplica la frecuencia</td></tr><tr><td>BitsDown</td><td>Reduce resolución de amplitud</td><td>Bitcrusher</td></tr><tr><td>RateDown</td><td>Reduce frecuencia de muestreo</td><td>Sample rate reducer / decimator</td></tr><tr><td>Crossover</td><td>Hueco cerca de cero, como un ampli clase B</td><td>Waveshaper con zona muerta</td></tr></tbody></table></div>\n<aside class=\"note\"><strong class=\"lbl\">Tip</strong> La misma cantidad de distorsión produce volúmenes muy distintos según el tipo. Ajusta el nivel de salida cada vez que cambies de curva.</aside>\n<h3>Compresión</h3>\n<p>El compresor reduce la ganancia de lo que supera un umbral. Ratio fija cuánto: con 2:1, cada 2 dB sobre el umbral salen como 1 dB. Attack fija cuán rápido reacciona; un attack lento deja pasar el transiente y da más “punch” a bajos y percusión. Release (y hold, si existe) fija cuánto tarda en soltar; tiempos demasiado cortos producen “pumping” audible. El make-up gain o auto-gain compensa la pérdida de nivel. En la Library busca “compressor”.</p>\n<h3>Delay</h3>\n<p>El delay repite la señal tras un tiempo. Feedback devuelve la salida a la entrada y crea repeticiones sucesivas; sobre 100 % el delay auto-oscila. <b>Delay</b> (Fundamental) tiene TIME, FEEDBACK, TONE (filtra las repeticiones) y MIX. Para un delay estéreo tipo ping-pong, usa dos delays y envía uno a cada canal de <b>Audio</b>, con tiempos distintos.</p>\n<h3>Chorus, flanger y phaser</h3>\n<p>Los tres mezclan la señal con una copia retrasada cuyo tiempo modula un LFO. El tiempo de retraso define el efecto: 10–30 ms produce chorus (copias desafinadas), 1–10 ms con feedback produce flanger (filtro peine que barre), y filtros all-pass en cascada producen phaser. Se pueden construir con el Delay de Fundamental: TIME muy corto, un LFO lento en la entrada CV de TIME y MIX al 50 %.</p>\n<figure class=\"fig\"><div class=\"figscroll\"><svg class=\"fig-svg\" role=\"img\" aria-label=\"Fig. 10. Chorus con el Delay de Fundamental. Agrega feedback y reduce TIME para pasar a flanger.\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 453 124\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><clipPath id=\"clip11\"><rect x=\"0\" y=\"0\" width=\"453.5433070866142\" height=\"124.7244094488189\"/></clipPath><g id=\"group\" transform=\"scale(1,-1) translate(0,-124)\" style=\"clip-path: url(#clip11)\"><g transform=\"\"><rect x=\"0.0\" y=\"59.527559055118104\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"29.597111066683073\" y=\"81.63779527559055\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,163) scale(1,-1)\">VCA</text><text x=\"33.168595441683074\" y=\"66.89763779527559\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,133) scale(1,-1)\">voz</text><rect x=\"119.05511811023624\" y=\"59.527559055118104\" width=\"76.53543307086616\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"145.2474440206693\" y=\"81.63779527559055\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,163) scale(1,-1)\">Delay</text><text x=\"137.7301100362943\" y=\"66.89763779527559\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,133) scale(1,-1)\">TIME ~15 ms</text><rect x=\"0.0\" y=\"-2.8346456692913478\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"30.020157941683074\" y=\"19.275590551181097\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,38) scale(1,-1)\">LFO</text><text x=\"23.21234544168307\" y=\"4.535433070866134\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,9) scale(1,-1)\">TRI 0,5 Hz</text><rect x=\"238.11023622047247\" y=\"59.527559055118104\" width=\"76.53543307086613\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"264.0984605684055\" y=\"81.63779527559055\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,163) scale(1,-1)\">Audio</text><polyline points=\"76.53543 77.95276, 97.79528 77.95276, 97.79528 77.95276, 114.5197 77.95276\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"119.0551 77.95276, 113.3858 80.7874, 113.3858 75.11811\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><polyline points=\"76.53543 15.59055, 97.79528 15.59055, 97.79528 69.44882, 114.5197 69.44882\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"119.0551 69.44882, 113.3858 72.28346, 113.3858 66.61417\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><text x=\"100.62992125984253\" y=\"45.354330708661415\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--cv); stroke:none;\" transform=\"translate(0,90) scale(1,-1)\">TIME CV</text><polyline points=\"195.5906 77.95276, 216.8504 77.95276, 216.8504 77.95276, 233.5748 77.95276\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"238.1102 77.95276, 232.4409 80.7874, 232.4409 75.11811\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/></g></g></svg>\n</div><figcaption>Fig. 10. Chorus con el Delay de Fundamental. Agrega feedback y reduce TIME para pasar a flanger.</figcaption></figure>\n<h3>Reverb</h3>\n<p>La reverb simula las reflexiones de un espacio. Size o decay fija el tamaño; damping atenúa agudos en la cola; pre-delay separa el sonido directo de la cola. <b>Plateau</b> (Valley) es una reverb de placa de alta calidad y gratuita.</p>\n<h3>Gator: secuencia de volumen</h3>\n<p>El gator del hardware es una compuerta de ruido disparada por un patrón de hasta 32 pasos, cada uno con su volumen. Corta la nota sostenida en un ritmo. En VCV se construye con un secuenciador y un VCA:</p>\n<figure class=\"fig\"><div class=\"figscroll\"><svg class=\"fig-svg\" role=\"img\" aria-label=\"Fig. 11. Gator. SEQ 3 marca los pasos activos; una de sus filas de CV puede escalar el nivel de cada paso con un segundo VCA. El attack del ADSR equivale al edge slew.\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 453 113\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><clipPath id=\"clip12\"><rect x=\"0\" y=\"0\" width=\"453.5433070866142\" height=\"113.38582677165356\"/></clipPath><g id=\"group\" transform=\"scale(1,-1) translate(0,-113)\" style=\"clip-path: url(#clip12)\"><g transform=\"\"><rect x=\"0.0\" y=\"8.503937007874015\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"21.488712629183073\" y=\"30.61417322834646\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,61) scale(1,-1)\">Clocked</text><text x=\"31.487613996370573\" y=\"15.874015748031496\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,31) scale(1,-1)\">16th</text><rect x=\"113.38582677165356\" y=\"8.503937007874015\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"139.12356283833662\" y=\"30.61417322834646\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,61) scale(1,-1)\">SEQ 3</text><text x=\"132.04785483052413\" y=\"15.874015748031496\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,31) scale(1,-1)\">gates + nivel</text><rect x=\"226.7716535433071\" y=\"8.503937007874015\" width=\"76.53543307086616\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"253.28126460999022\" y=\"30.61417322834646\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,61) scale(1,-1)\">ADSR</text><text x=\"249.9018944928027\" y=\"15.874015748031496\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,31) scale(1,-1)\">A/R cortos</text><rect x=\"226.7716535433071\" y=\"76.53543307086615\" width=\"76.53543307086616\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"257.2760888287402\" y=\"98.64566929133859\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,197) scale(1,-1)\">Voz</text><text x=\"259.4865136334277\" y=\"83.90551181102363\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,167) scale(1,-1)\">pad</text><rect x=\"340.15748031496065\" y=\"76.53543307086615\" width=\"76.53543307086613\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"369.7545913816437\" y=\"98.64566929133859\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,197) scale(1,-1)\">VCA</text><polyline points=\"76.53543 26.92913, 94.96063 26.92913, 94.96063 26.92913, 108.8504 26.92913\" style=\"stroke: var(--gate); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"113.3858 26.92913, 107.7165 29.76378, 107.7165 24.09449\" style=\"stroke: var(--gate); stroke-linecap: butt; stroke-width: 0.1; fill: var(--gate); fill-rule: evenodd;\"/><text x=\"83.55794014517717\" y=\"30.61417322834646\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--gate); stroke:none;\" transform=\"translate(0,61) scale(1,-1)\">CLK</text><polyline points=\"189.9213 26.92913, 208.3465 26.92913, 208.3465 26.92913, 222.2362 26.92913\" style=\"stroke: var(--gate); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"226.7717 26.92913, 221.1024 29.76378, 221.1024 24.09449\" style=\"stroke: var(--gate); stroke-linecap: butt; stroke-width: 0.1; fill: var(--gate); fill-rule: evenodd;\"/><text x=\"194.57218488558075\" y=\"30.61417322834646\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--gate); stroke:none;\" transform=\"translate(0,61) scale(1,-1)\">GATE</text><polyline points=\"303.3071 94.96063, 321.7323 94.96063, 321.7323 94.96063, 335.622 94.96063\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"340.1575 94.96063, 334.4882 97.79528, 334.4882 92.12598\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><polyline points=\"303.3071 26.92913, 321.7323 26.92913, 321.7323 86.45669, 335.622 86.45669\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"340.1575 86.45669, 334.4882 89.29134, 334.4882 83.62205\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><text x=\"324.5669291338583\" y=\"59.52755905511812\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--cv); stroke:none;\" transform=\"translate(0,119) scale(1,-1)\">CV</text></g></g></svg>\n</div><figcaption>Fig. 11. Gator. SEQ 3 marca los pasos activos; una de sus filas de CV puede escalar el nivel de cada paso con un segundo VCA. El attack del ADSR equivale al edge slew.</figcaption></figure>\n<h3>Paneo</h3>\n<p>El paneo reparte la señal entre izquierda y derecha. Un auto-pan modula esa posición con un LFO. En VCV: dos VCA, uno por canal; el LFO unipolar controla uno y su versión invertida (8vert en negativo más offset, o el switch de inversión del LFO en una segunda instancia sincronizada) controla el otro. La suma de ganancias lineales constante produce una caída de volumen en el centro; si te molesta, usa un módulo de paneo dedicado con ley de igual potencia.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Efecto del hardware</th><th>Módulo sugerido en VCV</th></tr></thead><tbody><tr><td>EQ</td><td>VCF en HPF para limpiar graves; EQ paramétricos de la Library</td></tr><tr><td>Compressor</td><td>Busca “compressor” en la Library</td></tr><tr><td>Distortion</td><td>DRIVE del VCF; waveshapers y bitcrushers de la Library</td></tr><tr><td>Delay</td><td>Delay (Fundamental)</td></tr><tr><td>Reverb</td><td>Plateau (Valley)</td></tr><tr><td>Chorus / Phaser</td><td>Delay + LFO (Fig. 10); módulos dedicados en la Library</td></tr><tr><td>Gator</td><td>Clocked + SEQ 3 + ADSR + VCA (Fig. 11)</td></tr><tr><td>Pan / Auto-pan</td><td>Dos VCA + LFO; o módulo de paneo</td></tr></tbody></table></div>"}, {"n": 10, "kick": "PRÁCTICA", "title": "Patches de estudio", "html": "<p>Cinco patches que combinan los capítulos anteriores. Cada uno aísla una idea. Arma el patch, escucha, y luego cambia un solo parámetro a la vez.</p>\n<h3>1 · Bajo pluck</h3>\n<ul><li>VCO: SAW + SQR una octava abajo (Octave −1) mezclados.</li><li>VCF: LPF, FREQ baja, RES 30 %, DRIVE 20 %.</li><li>ADSR filtro: A 0, D 150 ms, S 0, R 100 ms; FREQ CV +60 %.</li><li>ADSR amplitud: A 0, D 400 ms, S 40 %, R 80 ms.</li><li>Variación: VEL → FREQ CV del VCF. Las notas fuertes suenan más brillantes.</li></ul>\n<h3>2 · Pad de cuerdas</h3>\n<ul><li>Tres VCO en SAW con unison (Fig. 3) y drift con Random lento.</li><li>VCF: LPF medio, RES baja; key tracking 50 %.</li><li>ADSR amplitud: A 800 ms, D 1 s, S 80 %, R 2 s.</li><li>LFO TRI 0,2 Hz → FREQ CV del VCF, profundidad pequeña.</li><li>Chorus (Fig. 10) y Plateau al final.</li></ul>\n<h3>3 · Lead sincronizado</h3>\n<ul><li>VCO 1 SQR → SYNC del VCO 2; se escucha solo el VCO 2 (SAW).</li><li>ADSR 3: A 0, D 600 ms, S 0 → FM (pitch) del VCO 2: el barrido de sync.</li><li>Vibrato con fade in (Fig. 7), profundidad en MW.</li><li>Delay en corcheas con feedback 35 %.</li></ul>\n<h3>4 · Campana con ring mod</h3>\n<ul><li>VCO 1 SIN y VCO 3 SIN a +7 semitonos y 13 cents → A*B+C.</li><li>Mezcla 70 % ring mod, 30 % VCO 1.</li><li>ADSR amplitud: A 0, D 2 s, S 0, R 2 s. Decay tracking negativo: los agudos decaen antes.</li><li>Plateau con decay largo.</li></ul>\n<h3>5 · Percusión desde ruido</h3>\n<ul><li>Hi-hat: Noise blanco → VCF en HPF alto → VCA con ADSR A 0, D 40 ms, S 0.</li><li>Snare: Noise rosa → VCF pasa banda + VCO TRI con pitch drop (ADSR → FM); ambos con decay de 150 ms.</li><li>Kick: VCF en auto-oscilación (RES máx.) sin entrada, ADSR rápido → FREQ CV para el pitch drop, otro ADSR → VCA.</li><li>Dispara los tres con SEQ 3 y Clocked: nota fija, sin V/Oct.</li></ul>\n<h3>Diagnóstico rápido</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Síntoma</th><th>Causa probable</th></tr></thead><tbody><tr><td>Silencio</td><td>Falta el gate al ADSR, VCA sin CV, Audio sin dispositivo, cutoff en el mínimo</td></tr><tr><td>Nota que no termina</td><td>Sustain al máximo y release largo; o el gate quedó pegado</td></tr><tr><td>Distorsión no deseada</td><td>Mixer con todas las entradas al máximo; drive o resonancia altas</td></tr><tr><td>Desafinado entre octavas</td><td>V/Oct pasando por un atenuador que no está al 100 %</td></tr><tr><td>Polifonía que suena mono</td><td>MIDI-CV en 1 canal; o un módulo intermedio monofónico</td></tr><tr><td>Solo suena una voz</td><td>Falta Sum antes de Audio (Audio toma el primer canal)</td></tr><tr><td>Click al inicio de nota</td><td>Attack 0 sobre fase libre; sube el attack a 2–5 ms</td></tr></tbody></table></div>"}, {"n": 11, "kick": "REFERENCIA", "title": "Apéndice: índice de módulos", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Función</th><th>Módulo</th><th>Plugin</th></tr></thead><tbody><tr><td>Entrada MIDI / teclado</td><td>MIDI-CV, MIDI-CC, MIDI-Map</td><td>Core</td></tr><tr><td>Salida de audio</td><td>Audio</td><td>Core</td></tr><tr><td>Oscilador analógico</td><td>VCO</td><td>Fundamental</td></tr><tr><td>Oscilador wavetable</td><td>WT VCO</td><td>Fundamental</td></tr><tr><td>Ruido</td><td>Noise</td><td>Fundamental</td></tr><tr><td>Filtro LP/HP 4 polos</td><td>VCF</td><td>Fundamental</td></tr><tr><td>Filtro multimodo</td><td>VCF</td><td>Bogaudio</td></tr><tr><td>Envolvente</td><td>ADSR</td><td>Fundamental</td></tr><tr><td>Envolvente con delay/hold</td><td>DADSRH</td><td>Bogaudio</td></tr><tr><td>Función cíclica / AR</td><td>Rampage</td><td>Befaco</td></tr><tr><td>LFO</td><td>LFO</td><td>Fundamental</td></tr><tr><td>Aleatorio / S&amp;H</td><td>Random</td><td>Fundamental</td></tr><tr><td>Amplificador</td><td>VCA</td><td>Fundamental</td></tr><tr><td>Multiplicador / ring mod</td><td>A*B+C</td><td>Befaco</td></tr><tr><td>Mezcla</td><td>Mixer, VCV Mixer, Sum</td><td>Fundamental</td></tr><tr><td>Atenuverter</td><td>8vert</td><td>Fundamental</td></tr><tr><td>Polifonía</td><td>Split, Merge</td><td>Fundamental</td></tr><tr><td>Desplazamiento de octava</td><td>Octave</td><td>Fundamental</td></tr><tr><td>Cuantizador</td><td>Quantizer</td><td>Fundamental</td></tr><tr><td>Secuenciador</td><td>SEQ 3</td><td>Fundamental</td></tr><tr><td>Conmutador</td><td>Sequential Switch</td><td>Fundamental</td></tr><tr><td>Reloj maestro</td><td>Clocked</td><td>Impromptu</td></tr><tr><td>Delay</td><td>Delay</td><td>Fundamental</td></tr><tr><td>Reverb</td><td>Plateau</td><td>Valley</td></tr><tr><td>Silenciar canales</td><td>Mutes</td><td>Fundamental</td></tr><tr><td>Osciloscopio</td><td>Scope</td><td>Fundamental</td></tr></tbody></table></div>\n<p class=\"small\">Los nombres y controles de módulos de terceros cambian entre versiones. Si un control no coincide con lo descrito, el principio del capítulo sigue vigente: busca en la Library un módulo que cumpla esa función.</p>"}];

/* ---- notas ---- */
const CHORDS = { none: [0], maj: [0, 4, 7], min: [0, 3, 7], dom7: [0, 4, 7, 10], min7: [0, 3, 7, 10], sus4: [0, 5, 7], fifth: [0, 7, 12] };

/* ---- reloj: arpegiador, gator, S&H ---- */
function tick() {

  while (E.nextStep < t0 + .12) { step(E.step, E.nextStep, sd); E.nextStep += sd; E.step++; }
}

const KEYMAP = { a: 0, w: 1, s: 2, e: 3, d: 4, f: 5, t: 6, g: 7, y: 8, h: 9, u: 10, j: 11, k: 12, o: 13, l: 14, p: 15, 'ñ': 16, ';': 16 };

  const el = $('#keys'); if (!el) return;
  const base = kbBase(), whites = [], blacks = [];
  for (let n = base; n <= base + 24; n++) (BLACK.includes(n % 12) ? blacks : whites).push(n);
  const w = 100 / whites.length;
  el.innerHTML = whites.map(n => `<div class="key" data-note="${n}">${n % 12 === 0 ? `<span class="cap">${noteName(n)}</span>` : ''}</div>`).join('') +
    blacks.map(n => { const wi = whites.indexOf(n - 1); return `<div class="key black" data-note="${n}" style="left:calc(${(wi + 1) * w}% - ${w * .32}%);width:${w * .64}%"></div>`; }).join('');
  $('#oct-lbl').textContent = noteName(base) + '–' + noteName(base + 24);
  const active = new Map();
  const down = (e, k) => {
    const n = +k.dataset.note, r = k.getBoundingClientRect(), vel = clamp(.25 + .75 * (e.clientY - r.top) / r.height, .05, 1);
    if (UI.hold) { if (k.classList.contains('on')) { k.classList.remove('on'); keyUp(n); } else { k.classList.add('on'); keyDown(n, vel); } return; }

  el.onpointerup = up; el.onpointercancel = up;
}
UI.keysOff = () => document.querySelectorAll('.key.on').forEach(k => k.classList.remove('on'));
const pcDown = new Map();
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;

  if (!(key in KEYMAP) || !LABS[state.ch]) return;

  keyDown(n, E.lastVel);
});
addEventListener('keyup', e => {
  const key = e.key.toLowerCase(); const n = pcDown.get(key); if (n == null) return; pcDown.delete(key);
  if (UI.hold) return;

});
addEventListener('blur', () => { if (!UI.hold) { pcDown.clear(); allOff(); } });

function grid(g, w, h, d, kind) {
  g.fillStyle = colors['--screen']; g.fillRect(0, 0, w, h);
  g.strokeStyle = colors['--screen-grid']; g.lineWidth = 1;
  g.beginPath();
  if (kind === 'freq') [50, 100, 200, 500, 1000, 2000, 5000, 10000].forEach(f => { const x = Math.round(logX(f, w)) + .5; g.moveTo(x, 0); g.lineTo(x, h); });
  else for (let i = 1; i < 8; i++) { const x = Math.round(w * i / 8) + .5; g.moveTo(x, 0); g.lineTo(x, h); }
  for (let i = 1; i < 4; i++) { const y = Math.round(h * i / 4) + .5; g.moveTo(0, y); g.lineTo(w, y); }
  g.stroke();
  if (kind === 'freq') { g.fillStyle = colors['--screen-ink']; g.globalAlpha = .45; g.font = `${9 * d}px ui-monospace, monospace`; [[100, '100'], [1000, '1k'], [10000, '10k']].forEach(([f, t]) => g.fillText(t, logX(f, w) + 3 * d, h - 4 * d)); g.globalAlpha = 1; }
}
const tbuf = new Float32Array(4096), fbuf = new Float32Array(2048);
function drawScope(cv) {
  const [w, h, d] = fitCanvas(cv), g = cv.getContext('2d'); grid(g, w, h, d, 'time');
  if (!E.analyser) return;
  E.analyser.getFloatTimeDomainData(tbuf);
  let s = 0; for (let i = 1; i < 2048; i++) if (tbuf[i - 1] < 0 && tbuf[i] >= 0) { s = i; break; }
  const span = 1024; g.strokeStyle = colors['--screen-ink']; g.lineWidth = 1.6 * d; g.beginPath();
  for (let i = 0; i < span; i++) { const x = i / (span - 1) * w, y = h / 2 - tbuf[s + i] * h * .42; i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.stroke();
}
function drawSpectrum(cv) {
  const [w, h, d] = fitCanvas(cv), g = cv.getContext('2d'); grid(g, w, h, d, 'freq');
  if (!E.analyser) return;
  E.analyser.getFloatFrequencyData(fbuf);
  const sr = E.ctx.sampleRate, bin = sr / E.analyser.fftSize;
  g.strokeStyle = colors['--screen-ink']; g.lineWidth = 1.4 * d; g.beginPath(); let first = true;
  for (let x = 0; x < w; x += 2 * d) {
    const f = 20 * Math.pow(1000, x / w), i = Math.round(f / bin); if (i >= fbuf.length) break;
    const db = Math.max(fbuf[i], fbuf[i + 1] || -200), y = h - clamp((db + 100) / 90, 0, 1) * h;
    first ? g.moveTo(x, y) : g.lineTo(x, y); first = false;
  }
  g.stroke();
}
const off = new OfflineAudioContext(1, 1, 44100);
const RESP_N = 256, respF = new Float32Array(RESP_N), m1 = new Float32Array(RESP_N), p1 = new Float32Array(RESP_N), m2 = new Float32Array(RESP_N), p2 = new Float32Array(RESP_N);
for (let i = 0; i < RESP_N; i++) respF[i] = 20 * Math.pow(1000, i / (RESP_N - 1));
function drawFilter(cv) {
  const [w, h, d] = fitCanvas(cv), g = cv.getContext('2d'); grid(g, w, h, d, 'freq');
  const st = P.slope === '24' ? 2 : 1;
  const resp = (type, fc, mag, ph) => { if (type === 'off') { mag.fill(1); ph.fill(0); return; } const b = off.createBiquadFilter(); b.type = type; b.frequency.value = fc; b.Q.value = resQ(P.res, type); b.getFrequencyResponse(respF, mag, ph); for (let i = 0; i < RESP_N; i++) { mag[i] = Math.pow(mag[i], st); ph[i] *= st; } };
  resp(P.fType, P.cutoff, m1, p1);
  const out = new Float32Array(RESP_N);
  if (P.routing === 'single') out.set(m1);
  else {
    resp(P.f2Type, P.f2Cutoff, m2, p2);
    for (let i = 0; i < RESP_N; i++) {
      if (P.routing === 'serie') out[i] = m1[i] * m2[i];
      else { const a = 1 - P.balance, b = P.balance; const re = a * m1[i] * Math.cos(p1[i]) + b * m2[i] * Math.cos(p2[i]), im = a * m1[i] * Math.sin(p1[i]) + b * m2[i] * Math.sin(p2[i]); out[i] = Math.hypot(re, im); }
    }
  }
  const y0 = db => h * .3 - db / 60 * h * .7;
  g.strokeStyle = colors['--screen-grid']; g.setLineDash([3 * d, 3 * d]); g.beginPath(); g.moveTo(0, y0(0)); g.lineTo(w, y0(0)); g.stroke(); g.setLineDash([]);
  g.strokeStyle = colors['--audio']; g.lineWidth = 1.8 * d; g.beginPath();
  for (let i = 0; i < RESP_N; i++) { const x = i / (RESP_N - 1) * w, db = 20 * Math.log10(Math.max(out[i], 1e-5)), y = clamp(y0(db), 0, h); i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.stroke();
}
function drawADSR(cv) {
  const [w, h, d] = fitCanvas(cv), g = cv.getContext('2d'); grid(g, w, h, d, 'time');
  const hold = .8, total = Math.max(P.aA + P.aD * 1.5 + hold, P.fA + P.fD * 1.5 + hold) + Math.max(P.aR, P.fR) * 1.3;
  const shape = (A, D, S, R, color, peak) => {
    g.strokeStyle = color; g.lineWidth = 1.8 * d; g.beginPath();
    const offT = Math.max(A + D * 1.5, .05) + hold;
    for (let x = 0; x <= w; x += d) {
      const t = x / w * total; let v;
      const atOn = tt => tt < A ? tt / A : S + (1 - S) * Math.exp(-(tt - A) / (Math.max(D, .001) / 4));
      if (P.envRepeat && t < offT) { const cyc = Math.max(A + D, .02), tt = t % cyc; v = tt < A ? tt / A : 1 - (tt - A) / Math.max(D, .001); }
      else v = t < offT ? atOn(t) : atOn(offT) * Math.exp(-(t - offT) / (Math.max(R, .001) / 4));
      const y = h - 6 * d - v * peak * (h - 22 * d); x ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  };
  shape(P.fA, P.fD, P.fS, P.fR, colors['--cv'], .85);
  shape(P.aA, P.aD, P.aS, P.aR, colors['--audio'], 1);
  g.fillStyle = colors['--screen-ink']; g.globalAlpha = .5; g.font = `${9 * d}px ui-monospace, monospace`; g.fillText(num(total, 1) + ' s', w - 40 * d, h - 6 * d); g.globalAlpha = 1;
}
function drawStatic() { document.querySelectorAll('canvas[data-screen="filter"]').forEach(drawFilter); document.querySelectorAll('canvas[data-screen="adsr"]').forEach(drawADSR); }
function frame() {
  document.querySelectorAll('canvas[data-screen="scope"]').forEach(drawScope);
  document.querySelectorAll('canvas[data-screen="spectrum"]').forEach(drawSpectrum);
  if (E.ctx && E.stepQueue.length) {
    const t = now(); while (E.stepQueue.length && E.stepQueue[0][0] <= t) E.curStep = E.stepQueue.shift()[1];
    document.querySelectorAll('#gator button').forEach((b, i) => b.classList.toggle('now', P.gatorOn && i === E.curStep));
  }
  requestAnimationFrame(frame);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); drawStatic(); });
new MutationObserver(() => { readColors(); drawStatic(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
addEventListener('resize', drawStatic);

/* ---- rutas ---- */
function route() {
  // Sin ruta ni capítulo guardado, la guía abre en el prólogo.
  const leer = v => /^\d+$/.test(v) ? +v : v;
  const m = /^#(?:cap-(\d+)|(prologo|introduccion))$/.exec(location.hash);
  let n = m ? leer(m[1] ?? m[2]) : leer(store.get('vcv-cap') || 'prologo');
  if (!CHAPTERS.some(c => c.n === n)) n = 'prologo';
  const changed = n !== state.ch || !$('#chapter').innerHTML;
  state.ch = n; store.set('vcv-cap', n);
  renderChapter(n); renderLab(n);
  if (changed && m) scrollTo({ top: 0 });
}
addEventListener('hashchange', route);
readColors(); renderToc(); route(); requestAnimationFrame(frame);

</script>
