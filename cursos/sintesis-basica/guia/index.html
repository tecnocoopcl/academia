<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Síntesis sustractiva en VCV Rack · guía interactiva</title>
<meta name="description" content="Guía interactiva de síntesis sustractiva: cada capítulo con su laboratorio para escuchar y mover perillas, y su equivalente en VCV Rack.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: índice de capítulos | texto de la guía | laboratorio fijo con forma de panel de módulo (aluminio, tornillos, serigrafía) */
:root {
  --bg: #eceeeb;
  --surface: #ffffff;
  --panel: #d9dcd8;
  --panel-2: #cfd3ce;
  --ink: #17191a;
  --muted: #565d5b;
  --rule: #c3c8c4;
  --audio: #c2410c;
  --cv: #1d4ed8;
  --gate: #15803d;
  --poly: #7e22ce;
  --screen: #0f1412;
  --screen-ink: #9fe3b5;
  --screen-grid: #22302a;
  --key-white: #fbfbf9;
  --key-black: #1b1d1e;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111314; --surface: #1a1d1e; --panel: #24282a; --panel-2: #2c3133; --ink: #e7eae8; --muted: #9ba3a0;
    --rule: #353b3d; --audio: #f07a3e; --cv: #6f96ff; --gate: #41c070; --poly: #b583f0;
    --screen: #0a0d0c; --screen-ink: #9fe3b5; --screen-grid: #1b2621; --key-white: #d9dcd8; --key-black: #0c0d0e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111314; --surface: #1a1d1e; --panel: #24282a; --panel-2: #2c3133; --ink: #e7eae8; --muted: #9ba3a0;
  --rule: #353b3d; --audio: #f07a3e; --cv: #6f96ff; --gate: #41c070; --poly: #b583f0;
  --screen: #0a0d0c; --screen-ink: #9fe3b5; --screen-grid: #1b2621; --key-white: #d9dcd8; --key-black: #0c0d0e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 17px; line-height: 1.6; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cv); outline-offset: 2px; }

#app {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr) minmax(380px, 470px);
  grid-template-areas: "top top top" "toc chapter lab";
  gap: 0 40px;
  max-width: 1500px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
#app.no-lab { grid-template-columns: 220px minmax(0, 1fr); grid-template-areas: "top top" "toc chapter"; }
#app.no-lab .lab { display: none; }

/* top bar */
.topbar {
  grid-area: top; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding-block: 18px 16px; border-bottom: 1px solid var(--rule); margin-bottom: 28px;
}
.brand { text-decoration: none; color: var(--ink); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand-main { font-family: var(--f-display); font-weight: 800; font-stretch: 112%; font-size: 1.15rem; letter-spacing: -0.01em; }
.brand-sub { font-family: var(--f-ui); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
/* Enlaces de vuelta al curso y a academia (agregado al integrarla en academia). */
.volver { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-left: auto; font-family: var(--f-ui); font-size: 0.85rem; }
.volver a { color: var(--muted); text-decoration: none; }
.volver a:hover { color: var(--ink); text-decoration: underline; }
@media (max-width: 640px) { .topbar { flex-wrap: wrap; } .volver { order: 3; width: 100%; margin-left: 0; } }
.power {
  display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--rule); background: var(--surface);
  padding: 7px 14px 7px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap; font-family: var(--f-ui); font-size: 0.85rem; font-weight: 600;
}
.power .led { width: 9px; height: 9px; border-radius: 50%; background: var(--rule); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.power[aria-pressed="true"] .led { background: var(--gate); box-shadow: 0 0 8px var(--gate); }

/* chapter index */
.toc { grid-area: toc; position: sticky; top: 16px; align-self: start; display: flex; flex-direction: column; gap: 2px; font-family: var(--f-ui); }
.toc a {
  display: grid; grid-template-columns: 2.1em 1fr; gap: 4px; align-items: baseline;
  padding: 6px 8px; border-radius: 6px; text-decoration: none; color: var(--muted); font-size: 0.9rem; line-height: 1.3;
}
.toc a .num { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); }
.toc a:hover { color: var(--ink); background: var(--panel); }
.toc a[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: inset 3px 0 0 var(--audio); font-weight: 600; }

/* chapter text */
.chapter { grid-area: chapter; min-width: 0; max-width: 68ch; }
.eyebrow { font-family: var(--f-ui); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--audio); font-weight: 600; margin: 0 0 6px; }
.chapter h2 { font-family: var(--f-display); font-weight: 800; font-stretch: 115%; font-size: clamp(2rem, 3.6vw, 2.9rem); line-height: 1.02; letter-spacing: -0.02em; margin: 0 0 24px; text-wrap: balance; }
.chapter h2 .chn { font-family: var(--f-mono); font-weight: 400; font-size: 0.4em; color: var(--muted); vertical-align: 0.9em; margin-right: 0.5em; letter-spacing: 0; }
.chapter h3 { font-family: var(--f-display); font-weight: 700; font-stretch: 105%; font-size: 1.3rem; line-height: 1.2; margin: 36px 0 10px; text-wrap: balance; }
.chapter h4 { font-family: var(--f-ui); font-weight: 700; font-size: 0.95rem; margin: 22px 0 6px; }
.chapter p { margin: 0 0 14px; }
.chapter ul { margin: 0 0 16px; padding-left: 1.2em; }
.chapter li { margin-bottom: 6px; }
.chapter li::marker { color: var(--muted); }
.chapter code { font-family: var(--f-mono); font-size: 0.85em; }
.chapter b { font-weight: 650; }
.chapter .small { font-size: 0.85rem; color: var(--muted); }
.note { background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--cv); border-radius: 4px; padding: 12px 16px; margin: 16px 0 20px; font-family: var(--f-ui); font-size: 0.92rem; line-height: 1.5; }
.note .lbl { margin-right: 6px; }
.chapter .firma { margin-top: 24px; font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; }
.chapter .firma a { color: inherit; text-decoration-color: var(--audio); }
.tablewrap { overflow-x: auto; margin: 8px 0 22px; }
.chapter table { border-collapse: collapse; width: 100%; font-family: var(--f-ui); font-size: 0.86rem; line-height: 1.4; }
.chapter th { text-align: left; font-weight: 700; border-bottom: 1.5px solid var(--ink); padding: 6px 10px 6px 0; }
.chapter td { border-bottom: 1px solid var(--rule); padding: 7px 10px 7px 0; vertical-align: top; font-variant-numeric: tabular-nums; }
.fig { margin: 18px 0 22px; }
.figscroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 14px; }
.fig.legend .figscroll { background: transparent; border: 0; padding: 0; }
.fig-svg { display: block; width: 100%; min-width: 440px; height: auto; }
.fig.legend .fig-svg { min-width: 0; }
.fig figcaption { font-family: var(--f-ui); font-size: 0.82rem; color: var(--muted); margin-top: 8px; line-height: 1.45; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--rule); font-family: var(--f-ui); }
.pager a { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 0.92rem; }
.pager a span { display: block; font-weight: 400; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }
.pager a:hover { color: var(--audio); }

/* ---------- lab: front panel ---------- */
.lab {
  grid-area: lab; position: sticky; top: 16px; align-self: start;
  max-height: calc(100vh - 32px); overflow-y: auto; overscroll-behavior: contain;
  background: linear-gradient(180deg, var(--panel), var(--panel-2));
  border: 1px solid var(--rule); border-radius: 10px; font-family: var(--f-ui);
  padding: 16px 18px 18px; position: sticky;
}
.screws { position: relative; }
.screw { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--surface), var(--rule)); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.screw::after { content: ""; position: absolute; left: 1px; right: 1px; top: 4px; height: 1px; background: rgba(0,0,0,.35); transform: rotate(35deg); }
.lab-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; padding: 0 14px; }
.lab-title { font-weight: 800; font-stretch: 118%; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.08em; line-height: 1.2; }
.lab-title small { display: block; font-weight: 500; font-stretch: 100%; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.12em; }
.reset { border: 1px solid var(--rule); background: var(--surface); border-radius: 5px; padding: 4px 10px; font-size: 0.75rem; cursor: pointer; white-space: nowrap; }

.screens { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.screen { position: relative; background: var(--screen); border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 2px rgba(0,0,0,.35); }
.screen canvas { display: block; width: 100%; height: 108px; }
.screen.wide { grid-column: 1 / -1; }
.screen.wide canvas { height: 130px; }
.screen-label { position: absolute; left: 8px; top: 6px; font-family: var(--f-mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--screen-ink); opacity: 0.75; pointer-events: none; }
.readout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 12px; }
.readout div { background: var(--screen); color: var(--screen-ink); border-radius: 5px; padding: 6px 8px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 0.95rem; line-height: 1.2; }
.readout span { display: block; font-size: 0.58rem; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.7; }

/* keyboard strip */
.kbd-strip { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 8px; margin-bottom: 8px; }
.wheel { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wheel input { writing-mode: vertical-lr; direction: rtl; width: 22px; height: 104px; accent-color: var(--cv); }
.wheel label { font-size: 0.56rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); text-align: center; line-height: 1.1; }
.keys { position: relative; height: 120px; display: flex; user-select: none; touch-action: none; border-radius: 0 0 5px 5px; overflow: hidden; border-top: 3px solid var(--ink); }
.key { flex: 1; border: 1px solid var(--rule); border-top: 0; background: var(--key-white); border-radius: 0 0 4px 4px; position: relative; cursor: pointer; }
.key.black { position: absolute; top: 0; height: 62%; z-index: 2; background: var(--key-black); border-color: var(--key-black); flex: none; }
.key.on { background: var(--audio) !important; }
.key .cap { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-family: var(--f-mono); font-size: 0.55rem; color: var(--muted); pointer-events: none; }
.key.black .cap { color: #8a8f8d; }
.kbd-ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 0.75rem; margin: 0 0 14px 42px; color: var(--muted); }
.kbd-ctrl button { border: 1px solid var(--rule); background: var(--surface); border-radius: 5px; padding: 3px 9px; cursor: pointer; font-size: 0.75rem; }
.kbd-ctrl button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.kbd-ctrl .vel { display: inline-flex; align-items: center; gap: 6px; }
.kbd-ctrl input[type=range] { width: 80px; accent-color: var(--audio); }
.hint { font-size: 0.72rem; color: var(--muted); margin: -8px 0 14px 42px; line-height: 1.4; }
.hint kbd { font-family: var(--f-mono); font-size: 0.68rem; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--surface); }

/* control sections */
.sections { display: flex; flex-direction: column; gap: 12px; }
.sec { border-top: 1px solid var(--rule); padding-top: 10px; }
.sec-title { display: flex; align-items: center; gap: 8px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; margin: 0 0 8px; }
.sec-title::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--jack, var(--muted)); box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--rule); }
.ctrls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
.ctrl { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ctrl-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.ctrl label { font-size: 0.74rem; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctrl output { font-family: var(--f-mono); font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ctrl input[type=range] { width: 100%; accent-color: var(--jack, var(--audio)); margin: 2px 0 0; }
.ctrl select { width: 100%; background: var(--surface); border: 1px solid var(--rule); border-radius: 5px; padding: 4px 6px; font-size: 0.8rem; }
.ctrl.tog { flex-direction: row; align-items: center; gap: 8px; }
.ctrl.tog input { accent-color: var(--jack, var(--audio)); width: 16px; height: 16px; }
.ctrl.tog label { white-space: normal; }

.presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.presets button { border: 1px solid var(--rule); background: var(--surface); border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 0.78rem; font-weight: 600; }
.presets button[aria-pressed="true"] { border-color: var(--audio); box-shadow: inset 0 -2px 0 var(--audio); }

.gator { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; margin: 6px 0 2px; }
.gator button { aspect-ratio: 1 / 1.6; border: 1px solid var(--rule); background: var(--surface); border-radius: 3px; cursor: pointer; padding: 0; }
.gator button[aria-pressed="true"] { background: var(--gate); border-color: var(--gate); }
.gator button.now { box-shadow: 0 0 0 2px var(--audio); }
.gator button:nth-child(4n+1) { border-left-width: 2px; }

.try { margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 10px; }
.try h4 { margin: 0 0 6px; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.14em; }
.try ol { margin: 0; padding-left: 1.2em; font-size: 0.82rem; line-height: 1.45; }
.try li { margin-bottom: 4px; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  #app { grid-template-columns: minmax(0, 1fr) minmax(360px, 430px); grid-template-areas: "top top" "toc toc" "chapter lab"; gap: 0 28px; }
  #app.no-lab { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "toc" "chapter"; }
  .toc { position: static; flex-direction: row; overflow-x: auto; gap: 4px; margin-bottom: 24px; padding-bottom: 6px; }
  .toc a { grid-template-columns: auto auto; white-space: nowrap; }
}
@media (max-width: 860px) {
  #app, #app.no-lab { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "toc" "lab" "chapter"; }
  .lab { position: static; max-height: none; overflow: visible; margin-bottom: 28px; }
  body { font-size: 16px; }
}
@media (max-width: 420px) {
  .ctrls { grid-template-columns: minmax(0, 1fr); }
  .lab { padding: 14px 12px; }
  .readout div { font-size: 0.8rem; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="brand" href="#prologo"><span class="brand-main">Síntesis sustractiva</span><span class="brand-sub">en VCV Rack</span></a>
    <nav class="volver" aria-label="Curso"><a href="../">Índice del curso</a><a href="../manual.pdf">Manual en PDF</a><a href="/">academia</a></nav>
    <button id="power" class="power" type="button" aria-pressed="false"><span class="led" aria-hidden="true"></span><span id="power-label">Activar audio</span></button>
  </header>
  <nav class="toc" id="toc" aria-label="Capítulos"></nav>
  <main class="chapter" id="chapter"></main>
  <section class="lab" id="lab" aria-label="Laboratorio"></section>
</div>
<script>
const CHAPTERS = [{"n": "prologo", "kick": "ANTES DE EMPEZAR", "title": "Prólogo", "html": "<p>Desde que tomé una guitarra por allá por los 2000 nunca más me separé de la música. Si bien gracias a mi papá estaba embebido en un modesto mundo musical (tenía una grabadora, y era contador de una radio AM en Vicuña, en Chile), pronto, con el advenimiento de los computadores en casa, descubrí diversos programas para poder grabar sonidos de forma digital. Diversas herramientas usé, como Audacity o Cubase; pero Fruity Loops –hoy llamado FL Studio– tenía algo más: ofrecía samples, efectos de sonido e instrumentos digitales, entre ellos el 3xOsc: un sintetizador. Desde ese entonces tuve una cercanía con los sintetizadores y el protocolo MIDI, que me permitía usar mi teclado de juguete, un Casio MA150, y poder hacer música electrónica, y bases para tocar guitarra encima. Pero no fue hasta que compré el sintetizador Ultranova de Novation, por ahí por el 2016, que tuve acceso a una guía básica de sintetización, y eso me marcó. Fue muy emocionante, y por eso lo recuerdo vivamente: por fin podía entender, ya no solo de manera intuitiva, un sintetizador, cómo funcionaba, cómo se interconectaban las distintas piezas, y por fin sentía que podía expresarme de mejor forma, más allá de reconfigurar un preset que me gustase.</p>\n<p>Hoy, a más de dos décadas de ese primer acercamiento con estos instrumentos, quiero construir esta guía –y otros artefactos complementarios– para devolver al mundo esa posibilidad de sentir lo que yo sentí cuando pude entender lo que ya hacía de forma intuitiva, esa sensación de logro infinita que me abrió otras posibilidades, incluso en esos albores donde manipular un sintetizador parece programación (que es una actividad que disfruto mucho hoy en día, de una forma particularmente distinta, claro).</p>\n<p>Espero de corazón que esta guía te entregue conceptos y conocimientos básicos para que puedas navegar en este hermoso mundo de la sintetización.</p>\n<p class=\"firma\"><a href=\"https://aebn.cl\" rel=\"author\">Alejandro</a>.</p><p class=\"small\">Si quieres conocer más de lo que hago, visita <a href=\"https://aebn.cl\" rel=\"author\">aebn.cl</a>.</p>"}, {"n": "introduccion", "kick": "ANTES DE EMPEZAR", "title": "Introducción", "html": "<p>Esta es una guía básica, pensada en tres artefactos para que puedas construir conocimientos.</p>\n<p>El primer artefacto es la guía en sí misma, donde encontrarás los contenidos principales del curso, con imágenes que te puedan ayudar a comprenderlos. Puedes leerla aquí, capítulo a capítulo, o descargarla en PDF para leerla con calma o imprimirla.</p>\n<p>El segundo artefacto es lo que tienes en pantalla. Dado que esta es una guía para entender y producir sonidos, programé esta aplicación web: cada módulo del curso trae, junto al texto, un laboratorio con un sintetizador que puedes tocar con el teclado del computador o en pantalla, para escuchar y mover cada parámetro mientras lees. Para que suene, presiona <b>Activar audio</b> arriba.</p>\n<p>Y por último, para que puedas experimentar con un sintetizador que una todos estos conceptos, creé <b>zinte</b>, un sintetizador para VCV Rack, una aplicación gratuita que puedes descargar y donde podrás hacer tus propias configuraciones y sonidos.</p>\n<p>Todo esto es parte de un mismo conjunto:</p>\n<ul>\n<li><b>Guía:</b> <a href=\"../manual.pdf\">descargar en PDF</a>.</li>\n<li><b>Aplicación web:</b> estás en ella. Los capítulos están en el índice; el siguiente es <a href=\"#cap-0\">Cómo usar esta guía</a>.</li>\n<li><b>Zinte y VCV Rack:</b> <a href=\"https://vcvrack.com/Rack\">descarga VCV Rack</a>, gratis. El enlace para descargar zinte estará aquí pronto.</li>\n</ul>"}, {"n": 0, "kick": "PUNTO DE PARTIDA", "title": "Cómo usar esta guía", "html": "<p>Un sintetizador de hardware es un patch modular cableado de fábrica: osciladores, mixer, filtros, envolventes, LFOs, una matriz de modulación y una cadena de efectos, todo conectado por un bus interno que el panel oculta. VCV Rack expone ese bus. Cada parámetro del menú del hardware corresponde a una perilla, a un cable o a una pequeña sub-red de módulos.</p>\n<p>La guía sigue el orden de un manual de sintetizador: fuente → mezcla → filtrado → contorno → modulación → control → efectos. Cada capítulo tiene tres partes: el concepto, el equivalente en VCV (módulos y cableado) y un patch de práctica. Al final de cada capítulo una tabla traduce los parámetros del hardware a VCV.</p>\n<h4>Convenciones de los diagramas</h4>\n<figure class=\"fig legend\"><div class=\"figscroll\"><svg class=\"fig-svg\" role=\"img\" aria-label=\"Leyenda de colores de cable\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 453 19\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><clipPath id=\"clip1\"><rect x=\"0\" y=\"0\" width=\"453.5433070866142\" height=\"19.84251968503937\"/></clipPath><g id=\"group\" transform=\"scale(1,-1) translate(0,-19)\" style=\"clip-path: url(#clip1)\"><g transform=\"\"><polyline points=\"0 9.92126, 25.51181 9.92126\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.3; fill: None; fill-rule: evenodd;\"/><text x=\"31.181102362204726\" y=\"6.803149606299213\" style=\"font-family: var(--f-ui); font-size: 7px;fill: var(--muted); stroke:none;\" transform=\"translate(0,13) scale(1,-1)\">audio</text><polyline points=\"107.7165 9.92126, 133.2283 9.92126\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.3; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><text x=\"138.8976377952756\" y=\"6.803149606299213\" style=\"font-family: var(--f-ui); font-size: 7px;fill: var(--muted); stroke:none;\" transform=\"translate(0,13) scale(1,-1)\">CV / modulación</text><polyline points=\"215.4331 9.92126, 240.9449 9.92126\" style=\"stroke: var(--gate); stroke-linecap: butt; stroke-width: 1.3; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><text x=\"246.6141732283465\" y=\"6.803149606299213\" style=\"font-family: var(--f-ui); font-size: 7px;fill: var(--muted); stroke:none;\" transform=\"translate(0,13) scale(1,-1)\">gate / trigger</text><polyline points=\"323.1496 9.92126, 348.6614 9.92126\" style=\"stroke: var(--poly); stroke-linecap: butt; stroke-width: 1.3; fill: None; fill-rule: evenodd;\"/><text x=\"354.33070866141736\" y=\"6.803149606299213\" style=\"font-family: var(--f-ui); font-size: 7px;fill: var(--muted); stroke:none;\" transform=\"translate(0,13) scale(1,-1)\">polifónico</text></g></g></svg>\n</div></figure>\n<p>Los módulos sin prefijo pertenecen a <b>VCV Fundamental</b> o <b>Core</b>, que vienen con Rack. Los demás indican su plugin entre paréntesis (Befaco, Bogaudio, Valley, Impromptu); todos son gratuitos en la VCV Library.</p>\n<h3>Convenciones eléctricas de VCV</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Señal</th><th>Rango típico</th><th>Uso</th></tr></thead><tbody><tr><td>Audio</td><td>±5 V</td><td>Salida de osciladores, filtros, efectos</td></tr><tr><td>CV unipolar</td><td>0 a +10 V</td><td>Envolventes, niveles, cutoff</td></tr><tr><td>CV bipolar</td><td>±5 V</td><td>LFOs, pitch bend, modulación simétrica</td></tr><tr><td>V/Oct</td><td>1 V = 1 octava; 0 V = C4</td><td>Afinación. 1 semitono = 1/12 V ≈ 83,3 mV</td></tr><tr><td>Gate</td><td>0 V / +10 V sostenido</td><td>Nota presionada</td></tr><tr><td>Trigger</td><td>pulso corto de +10 V</td><td>Reset, reloj, retrigger</td></tr></tbody></table></div>\n<h4>Polifonía</h4>\n<p>Un cable de VCV transporta hasta 16 canales. MIDI-CV con <i>Polyphony channels</i> &gt; 1 entrega V/Oct, gate y velocity polifónicos; VCO, VCF, ADSR y VCA de Fundamental procesan cada canal por separado, de modo que una sola fila de módulos ya es un sinte polifónico. El cable polifónico se dibuja más grueso. Antes de la salida de audio, <b>Sum</b> o <b>VCV Mixer</b> colapsan los canales a mono.</p>\n<h4>Atajos que usarás todo el tiempo</h4>\n<ul><li>Ctrl/Cmd + arrastrar una perilla: ajuste fino. Clic derecho sobre la perilla: escribir el valor exacto.</li><li>Ctrl/Cmd + clic sobre un jack de salida: duplica el cable (mult implícito). Una salida alimenta cualquier número de entradas.</li><li>Dos cables hacia una misma entrada no se suman: VCV acepta un solo cable por entrada. Sumar requiere un mixer o <b>Sum</b>.</li><li>Ctrl/Cmd + E: duplicar el patch seleccionado. Guarda subpatches como <i>selection</i> (.vcvs) para reutilizarlos.</li></ul>"}, {"n": 1, "kick": "ARQUITECTURA", "title": "La voz sustractiva", "html": "<p>La síntesis sustractiva parte de una forma de onda rica en armónicos y le resta contenido con un filtro. La amplitud y el timbre cambian en el tiempo por acción de envolventes y LFOs. El hardware fija este orden; en VCV lo construyes explícitamente.</p>\n<p>La cadena mínima tiene cinco módulos y tres tipos de señal. MIDI-CV convierte el teclado en voltajes. VCO genera la onda. VCF la filtra. VCA controla el volumen. ADSR genera el contorno que abre el VCA cuando llega el gate.</p>\n<figure class=\"fig\"><div class=\"figscroll\"><svg class=\"fig-svg\" role=\"img\" aria-label=\"Fig. 1. Voz sustractiva básica. Con MIDI-CV en modo polifónico, la misma fila suena polifónica; agrega Sum antes de Audio.\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 453 147\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><clipPath id=\"clip2\"><rect x=\"0\" y=\"0\" width=\"453.5433070866142\" height=\"147.40157480314963\"/></clipPath><g id=\"group\" transform=\"scale(1,-1) translate(0,-147)\" style=\"clip-path: url(#clip2)\"><g transform=\"\"><rect x=\"0.0\" y=\"53.85826771653544\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"21.197404035433074\" y=\"75.96850393700788\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,151) scale(1,-1)\">MIDI-CV</text><text x=\"31.375260480745574\" y=\"61.22834645669292\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,122) scale(1,-1)\">Core</text><rect x=\"104.88188976377954\" y=\"99.21259842519686\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"134.18954770546262\" y=\"121.3228346456693\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,242) scale(1,-1)\">VCO</text><text x=\"136.34213559608762\" y=\"106.58267716535434\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,213) scale(1,-1)\">SAW</text><rect x=\"209.76377952755908\" y=\"99.21259842519686\" width=\"76.53543307086616\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"239.70600778174216\" y=\"121.3228346456693\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,242) scale(1,-1)\">VCF</text><text x=\"242.91220895361715\" y=\"106.58267716535434\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,213) scale(1,-1)\">LPF</text><rect x=\"314.6456692913386\" y=\"99.21259842519686\" width=\"76.53543307086613\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"344.24278035802166\" y=\"121.3228346456693\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,242) scale(1,-1)\">VCA</text><rect x=\"209.76377952755908\" y=\"14.173228346456696\" width=\"76.53543307086616\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"236.27339059424216\" y=\"36.28346456692914\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,72) scale(1,-1)\">ADSR</text><rect x=\"377.0078740157481\" y=\"14.173228346456696\" width=\"76.53543307086613\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"402.99609836368114\" y=\"36.28346456692914\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,72) scale(1,-1)\">Audio</text><text x=\"408.38313449649365\" y=\"21.543307086614178\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,43) scale(1,-1)\">Core</text><polyline points=\"76.53543 77.95276, 90.70866 77.95276, 90.70866 117.6378, 100.3465 117.6378\" style=\"stroke: var(--poly); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"104.8819 117.6378, 99.2126 120.4724, 99.2126 114.8031\" style=\"stroke: var(--poly); stroke-linecap: butt; stroke-width: 0.1; fill: var(--poly); fill-rule: evenodd;\"/><text x=\"93.54330708661418\" y=\"100.62992125984253\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--poly); stroke:none;\" transform=\"translate(0,201) scale(1,-1)\">V/Oct</text><polyline points=\"181.4173 117.6378, 195.5906 117.6378, 195.5906 117.6378, 205.2283 117.6378\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"209.7638 117.6378, 204.0945 120.4724, 204.0945 114.8031\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><polyline points=\"286.2992 117.6378, 300.4724 117.6378, 300.4724 117.6378, 310.1102 117.6378\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"314.6457 117.6378, 308.9764 120.4724, 308.9764 114.8031\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><polyline points=\"76.53543 66.61417, 143.1496 66.61417, 143.1496 32.59843, 205.2283 32.59843\" style=\"stroke: var(--gate); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"209.7638 32.59843, 204.0945 35.43307, 204.0945 29.76378\" style=\"stroke: var(--gate); stroke-linecap: butt; stroke-width: 0.1; fill: var(--gate); fill-rule: evenodd;\"/><text x=\"145.98425196850397\" y=\"52.44094488188977\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--gate); stroke:none;\" transform=\"translate(0,104) scale(1,-1)\">GATE</text><polyline points=\"286.2992 32.59843, 300.4724 32.59843, 300.4724 109.1339, 310.1102 109.1339\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"314.6457 109.1339, 308.9764 111.9685, 308.9764 106.2992\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><text x=\"303.3070866141732\" y=\"73.7007874015748\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--cv); stroke:none;\" transform=\"translate(0,147) scale(1,-1)\">ENV→CV</text><polyline points=\"391.1811 106.2992, 399.685 106.2992, 399.685 2.834646, 365.6693 2.834646, 365.6693 41.10236, 372.4724 41.10236\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"377.0079 41.10236, 371.3386 43.93701, 371.3386 38.26772\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/></g></g></svg>\n</div><figcaption>Fig. 1. Voz sustractiva básica. Con MIDI-CV en modo polifónico, la misma fila suena polifónica; agrega Sum antes de Audio.</figcaption></figure>\n<h4>Patch de práctica</h4>\n<ul><li>Arma la Fig. 1. Pon MIDI-CV en 1 canal y el VCF con FREQ al máximo y RES en cero: escuchas el VCO crudo.</li><li>Baja FREQ hasta que la nota se vuelva opaca. Ese es el gesto central de la síntesis sustractiva.</li><li>Conecta un <b>Scope</b> a la salida del VCO y luego a la del VCF: la diente de sierra se redondea a medida que el filtro elimina armónicos altos.</li><li>Sube Polyphony channels a 6 en MIDI-CV y agrega <b>Sum</b> antes de Audio. Toca acordes.</li></ul>\n<h3>De menú a cable</h3>\n<p>El hardware organiza sus parámetros en menús (Oscillator, Mixer, Filter, Envelope, LFO, Modulation, Arp, FX). Cada menú es un capítulo de esta guía. El dato más importante del cambio de plataforma: en VCV la <i>modulación no es un menú aparte</i>. Cualquier salida puede ir a cualquier entrada; la matriz de modulación es todo el rack.</p>"}, {"n": 2, "kick": "FUENTE", "title": "Osciladores", "html": "<p>El oscilador fija la altura (pitch) y el contenido armónico inicial. Todo lo que el filtro pueda hacer depende de lo que el oscilador le entregue: un filtro solo resta, no agrega.</p>\n<h3>Formas de onda</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Onda</th><th>Armónicos</th><th>Carácter</th><th>Uso típico</th></tr></thead><tbody><tr><td>Seno</td><td>Solo la fundamental</td><td>Puro, sin brillo</td><td>Sub-bajo, FM, LFO</td></tr><tr><td>Triángulo</td><td>Impares, caen 1/n²</td><td>Suave, aflautado</td><td>Leads suaves, bajos redondos</td></tr><tr><td>Diente de sierra</td><td>Todos, caen 1/n</td><td>Brillante, metálico</td><td>Cuerdas, brass, pads, bajos</td></tr><tr><td>Cuadrada (50 %)</td><td>Impares, caen 1/n</td><td>Hueco, clarinete</td><td>Bajos, leads de chip</td></tr><tr><td>Pulso (≠ 50 %)</td><td>Variables según ancho</td><td>Nasal, delgado</td><td>PWM, pads animados</td></tr></tbody></table></div>\n<p><b>VCO</b> (Fundamental) entrega las cuatro ondas en paralelo. Las salidas operan simultáneamente: puedes mezclar SAW y SQR del mismo VCO en un mixer. El modo <i>analog</i> agrega imperfecciones sutiles; el modo <i>digital</i> produce ondas exactas.</p>\n<h3>Pulse width y PWM</h3>\n<p>La perilla PW mueve el ancho del pulso. Al alejarse de 50 % aparecen armónicos pares y el timbre se adelgaza. La modulación de ancho de pulso (PWM) conecta un LFO lento a la entrada PWM: el pulso “respira” y suena como dos osciladores levemente desafinados. Es el pad clásico de un solo oscilador.</p>\n<figure class=\"fig\"><div class=\"figscroll\"><svg class=\"fig-svg\" role=\"img\" aria-label=\"Fig. 2. PWM. Ajusta el atenuador PWM del VCO para que el pulso no llegue a 0 % ni 100 %: en los extremos el sonido desaparece.\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 453 62\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><clipPath id=\"clip3\"><rect x=\"0\" y=\"0\" width=\"453.5433070866142\" height=\"62.36220472440945\"/></clipPath><g id=\"group\" transform=\"scale(1,-1) translate(0,-62)\" style=\"clip-path: url(#clip3)\"><g transform=\"\"><rect x=\"0.0\" y=\"14.173228346456689\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"30.020157941683074\" y=\"36.28346456692913\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,72) scale(1,-1)\">LFO</text><text x=\"20.74056809793307\" y=\"21.54330708661417\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,43) scale(1,-1)\">TRI ~0,3 Hz</text><rect x=\"113.38582677165356\" y=\"14.173228346456689\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"142.69348471333663\" y=\"36.28346456692913\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,72) scale(1,-1)\">VCO</text><text x=\"145.40928061177414\" y=\"21.54330708661417\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,43) scale(1,-1)\">SQR</text><rect x=\"226.7716535433071\" y=\"14.173228346456689\" width=\"76.53543307086616\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"242.21339351624022\" y=\"36.28346456692913\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,72) scale(1,-1)\">VCF → VCA</text><polyline points=\"76.53543 32.59843, 94.96063 32.59843, 94.96063 32.59843, 108.8504 32.59843\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"113.3858 32.59843, 107.7165 35.43307, 107.7165 29.76378\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><text x=\"81.92756905142717\" y=\"36.28346456692913\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--cv); stroke:none;\" transform=\"translate(0,72) scale(1,-1)\">PWM</text><polyline points=\"189.9213 32.59843, 208.3465 32.59843, 208.3465 32.59843, 222.2362 32.59843\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"226.7717 32.59843, 221.1024 35.43307, 221.1024 29.76378\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/></g></g></svg>\n</div><figcaption>Fig. 2. PWM. Ajusta el atenuador PWM del VCO para que el pulso no llegue a 0 % ni 100 %: en los extremos el sonido desaparece.</figcaption></figure>\n<h3>Afinación: semitonos, cents y rango del pitch bend</h3>\n<p>El VCO suma todos los voltajes de pitch: perilla FREQ + entrada V/Oct + FM. Transponer un oscilador +7 semitonos equivale a sumarle 7/12 V. Para el pitch bend, conecta la salida PW de MIDI-CV (±5 V) a la entrada FM del VCO y ajusta el atenuador. Con FM en modo exponencial, 1/12 V por semitono: un rango de ±2 semitonos requiere escalar ±5 V a ±0,167 V (atenuador ≈ 3,3 %).</p>\n<h3>Densidad y desafinación (unison)</h3>\n<p>Densidad agrega copias del mismo oscilador; detune las separa unos pocos cents. El batido entre copias produce el sonido “grueso” de un supersaw. En VCV la técnica directa usa varios VCO con la misma V/Oct y FREQ ligeramente distinta (Ctrl + arrastrar). Tres VCO a −7, 0 y +7 cents ya producen un unison convincente. Más copias o más detune engordan el sonido; demasiado detune lo desafina.</p>\n<figure class=\"fig\"><div class=\"figscroll\"><svg class=\"fig-svg\" role=\"img\" aria-label=\"Fig. 3. Unison de tres osciladores. Baja cada canal del mixer a ~1/3 para evitar saturación.\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 453 147\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><clipPath id=\"clip4\"><rect x=\"0\" y=\"0\" width=\"453.5433070866142\" height=\"147.40157480314963\"/></clipPath><g id=\"group\" transform=\"scale(1,-1) translate(0,-147)\" style=\"clip-path: url(#clip4)\"><g transform=\"\"><rect x=\"0.0\" y=\"59.52755905511812\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"21.197404035433074\" y=\"81.63779527559056\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,163) scale(1,-1)\">MIDI-CV</text><rect x=\"113.38582677165356\" y=\"110.55118110236222\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"138.72649252583665\" y=\"132.66141732283467\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,265) scale(1,-1)\">VCO 1</text><text x=\"143.58857748677414\" y=\"117.9212598425197\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,235) scale(1,-1)\">−7 ct</text><rect x=\"113.38582677165356\" y=\"59.52755905511812\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"138.72649252583665\" y=\"81.63779527559056\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,163) scale(1,-1)\">VCO 2</text><text x=\"146.06035483052415\" y=\"66.8976377952756\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,133) scale(1,-1)\">0 ct</text><rect x=\"113.38582677165356\" y=\"8.503937007874015\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"138.72649252583665\" y=\"30.61417322834646\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,61) scale(1,-1)\">VCO 3</text><text x=\"143.58857748677414\" y=\"15.874015748031496\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,31) scale(1,-1)\">+7 ct</text><rect x=\"226.7716535433071\" y=\"59.52755905511812\" width=\"76.53543307086616\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"243.0594872662402\" y=\"81.63779527559056\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,163) scale(1,-1)\">VCV Mixer</text><text x=\"254.1583642193652\" y=\"66.8976377952756\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,133) scale(1,-1)\">o Mixer</text><rect x=\"334.488188976378\" y=\"59.52755905511812\" width=\"76.53543307086613\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"364.4304172305611\" y=\"81.63779527559056\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,163) scale(1,-1)\">VCF</text><polyline points=\"76.53543 77.95276, 94.96063 77.95276, 94.96063 128.9764, 108.8504 128.9764\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"113.3858 128.9764, 107.7165 131.811, 107.7165 126.1417\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><text x=\"97.79527559055119\" y=\"106.2992125984252\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--cv); stroke:none;\" transform=\"translate(0,212) scale(1,-1)\">V/Oct</text><polyline points=\"76.53543 77.95276, 94.96063 77.95276, 94.96063 77.95276, 108.8504 77.95276\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"113.3858 77.95276, 107.7165 80.7874, 107.7165 75.11811\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><polyline points=\"76.53543 77.95276, 94.96063 77.95276, 94.96063 26.92913, 108.8504 26.92913\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"113.3858 26.92913, 107.7165 29.76378, 107.7165 24.09449\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><polyline points=\"189.9213 128.9764, 208.3465 128.9764, 208.3465 86.45669, 222.2362 86.45669\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"226.7717 86.45669, 221.1024 89.29134, 221.1024 83.62205\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><polyline points=\"189.9213 77.95276, 208.3465 77.95276, 208.3465 77.95276, 222.2362 77.95276\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"226.7717 77.95276, 221.1024 80.7874, 221.1024 75.11811\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><polyline points=\"189.9213 26.92913, 208.3465 26.92913, 208.3465 69.44882, 222.2362 69.44882\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"226.7717 69.44882, 221.1024 72.28346, 221.1024 66.61417\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><polyline points=\"303.3071 77.95276, 318.8976 77.95276, 318.8976 77.95276, 329.9528 77.95276\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"334.4882 77.95276, 328.8189 80.7874, 328.8189 75.11811\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/></g></g></svg>\n</div><figcaption>Fig. 3. Unison de tres osciladores. Baja cada canal del mixer a ~1/3 para evitar saturación.</figcaption></figure>\n<h3>Drift: la imperfección como recurso</h3>\n<p>Los osciladores analógicos derivan: su afinación se mueve unos cents de forma lenta y aleatoria. El drift reproduce ese efecto y hace que un unison suene vivo en lugar de estático. En VCV, <b>Random</b> (Fundamental) con frecuencia baja y shape suavizado entrega una curva aleatoria lenta. Conéctala a la FM de cada VCO con un atenuador mínimo (1–2 %). Usa una salida distinta, o un Random distinto, por oscilador para que las derivas no se correlacionen.</p>\n<h3>Fase de inicio</h3>\n<p>La fase determina en qué punto del ciclo arranca la onda al presionar una tecla. Con fase libre, cada nota empieza en un punto distinto y los ataques varían levemente. Con fase fija, todas las notas arrancan igual: el ataque gana un “click” consistente, útil en bajos y percusión. En VCV, enviar el gate de MIDI-CV a la entrada SYNC del VCO reinicia la fase en cada nota.</p>\n<h4>Sync de osciladores</h4>\n<p>Hard sync reinicia un oscilador esclavo cada vez que el maestro completa un ciclo. Al barrer la frecuencia del esclavo, el timbre cambia de forma agresiva mientras la altura percibida sigue al maestro. Conecta SQR del VCO 1 a SYNC del VCO 2 y modula FREQ del VCO 2 con una envolvente: es el lead sincronizado clásico.</p>\n<h3>Wavetables e interpolación</h3>\n<p>Una wavetable es una secuencia de formas de onda de un ciclo. El parámetro <i>posición</i> recorre la tabla; la interpolación decide si el paso entre ondas adyacentes es gradual o abrupto. <b>WT VCO</b> (Fundamental) carga tablas .wav, expone POS como perilla y como entrada CV, e interpola entre ondas. Modular POS con un LFO o una envolvente produce cambios tímbricos que un VCO clásico no logra solo con el filtro.</p>\n<h3>Nota fija</h3>\n<p>Una nota fija ignora el teclado: cada tecla dispara la misma altura. Sirve para percusión y efectos. En VCV basta con no conectar V/Oct al VCO y conservar el gate hacia el ADSR. El teclado se convierte en un disparador.</p>\n<h3>Vibrato</h3>\n<p>El vibrato modula el pitch con un LFO de 4–7 Hz. La profundidad suele quedar bajo el mod wheel. En VCV es un caso de modulación multiplicada: LFO → VCA ← MW de MIDI-CV → FM del VCO. El capítulo 7 desarrolla este patrón.</p>\n<h3>Ruido</h3>\n<p>El ruido contiene energía en todas las frecuencias y no tiene altura definida. Sirve para viento, respiración, hi-hats, snares y para engrosar el ataque de una nota. <b>Noise</b> (Fundamental) entrega siete colores. El color define la pendiente espectral: el blanco tiene igual potencia por Hz y suena siseante; el rosa cae 3 dB/octava y suena más equilibrado al oído; rojo (browniano) cae 6 dB/oct y suena grave; azul y violeta suben y suenan más brillantes. Un filtro pasa banda sobre ruido blanco reproduce los tipos “High”, “Band” y “High-band” del hardware.</p>\n<h4>Traducción de parámetros</h4>\n<div class=\"tablewrap\"><table><thead><tr><th>Parámetro de hardware</th><th>Equivalente en VCV</th></tr></thead><tbody><tr><td>Wave / forma de onda</td><td>Salida elegida del VCO (SIN, TRI, SAW, SQR)</td></tr><tr><td>Semitones / Cents</td><td>FREQ del VCO (Ctrl+arrastrar o clic derecho para valor exacto)</td></tr><tr><td>Pulse width / PWM</td><td>Perilla PW + entrada PWM con su atenuador</td></tr><tr><td>Pitch wheel range</td><td>PW de MIDI-CV → FM del VCO, atenuador escalado a 1/12 V por semitono</td></tr><tr><td>Density / Density detune</td><td>Varios VCO en paralelo con FREQ ligeramente distinta</td></tr><tr><td>Oscillator drift</td><td>Random lento → FM, atenuación 1–2 %</td></tr><tr><td>Oscillator phase</td><td>Gate → SYNC del VCO (fase fija) o nada (fase libre)</td></tr><tr><td>Wavetable index / interpolation</td><td>WT VCO: perilla POS y entrada POS CV</td></tr><tr><td>Fixed note</td><td>No conectar V/Oct; solo gate</td></tr><tr><td>Vibrato depth / rate</td><td>LFO × MW (VCA) → FM del VCO</td></tr><tr><td>Noise type</td><td>Noise (color) + filtro pasa banda si hace falta</td></tr></tbody></table></div>"}, {"n": 3, "kick": "MEZCLA", "title": "Mixer y ring modulation", "html": "<p>El mixer suma las fuentes antes del filtro. En el hardware tiene entradas fijas: tres osciladores, ruido y dos ring modulators. En VCV eliges cuántas y cuáles.</p>\n<h3>Ganancia y headroom</h3>\n<p>El error clásico es subir todas las entradas al máximo. Tres ondas de ±5 V sumadas alcanzan ±15 V; el filtro y los efectos reciben una señal que satura o clipea. El criterio del manual vale igual en VCV: con varias fuentes activas, deja cada canal cerca de la mitad. Conecta un <b>Scope</b> a la salida del mixer y verifica que la señal se mantenga cerca de ±5 V. Las saturaciones deliberadas se hacen con el DRIVE del VCF, no con un mixer desbordado.</p>\n<h4>Solo y mute</h4>\n<p><b>Mutes</b> (Fundamental) silencia canales individuales sin mover niveles. Para escuchar una sola fuente, mutea las demás; equivale a la función Solo del hardware.</p>\n<h3>Ring modulation</h3>\n<p>El ring modulator multiplica dos señales de audio. Con entradas de frecuencias f₁ y f₂, la salida contiene f₁ + f₂ y |f₁ − f₂| y suprime las originales. Cuando la relación entre f₁ y f₂ no es un entero simple, esas frecuencias quedan fuera de la serie armónica y el resultado suena metálico, de campana o atonal. Con intervalos de quinta (+7), octava (+12) o cuarta (+5) el resultado es más armónico; con intervalos pequeños aparece batido.</p>\n<p>La multiplicación debe ser de cuatro cuadrantes: ambas señales bipolares. Un VCA estándar no sirve, porque recorta la parte negativa de la CV y produce modulación de amplitud (AM), no ring mod. <b>A*B+C</b> (Befaco) hace la multiplicación completa.</p>\n<figure class=\"fig\"><div class=\"figscroll\"><svg class=\"fig-svg\" role=\"img\" aria-label=\"Fig. 4. Ring modulator. Transpone VCO 3 en +5, +7 y +12 semitonos y compara; luego desafina unos cents para obtener batido.\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 453 113\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><clipPath id=\"clip5\"><rect x=\"0\" y=\"0\" width=\"453.5433070866142\" height=\"113.38582677165356\"/></clipPath><g id=\"group\" transform=\"scale(1,-1) translate(0,-113)\" style=\"clip-path: url(#clip5)\"><g transform=\"\"><rect x=\"0.0\" y=\"76.53543307086615\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"25.340665754183075\" y=\"98.64566929133859\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,197) scale(1,-1)\">VCO 1</text><text x=\"31.460245832308072\" y=\"83.90551181102363\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,167) scale(1,-1)\">SAW</text><rect x=\"0.0\" y=\"8.503937007874015\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"25.340665754183075\" y=\"30.61417322834646\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,61) scale(1,-1)\">VCO 3</text><text x=\"25.727335676058072\" y=\"15.874015748031496\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,31) scale(1,-1)\">SIN / TRI</text><rect x=\"119.05511811023624\" y=\"42.519685039370074\" width=\"76.53543307086616\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"143.5255690206693\" y=\"64.62992125984252\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,129) scale(1,-1)\">A*B+C</text><text x=\"147.2110182394193\" y=\"49.889763779527556\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,99) scale(1,-1)\">Befaco</text><rect x=\"238.11023622047247\" y=\"42.519685039370074\" width=\"76.53543307086613\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"264.39162463090554\" y=\"64.62992125984252\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,129) scale(1,-1)\">Mixer</text><rect x=\"345.82677165354335\" y=\"42.519685039370074\" width=\"76.53543307086613\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"375.7689999077264\" y=\"64.62992125984252\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,129) scale(1,-1)\">VCF</text><polyline points=\"76.53543 94.96063, 97.79528 94.96063, 97.79528 66.61417, 114.5197 66.61417\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"119.0551 66.61417, 113.3858 69.44882, 113.3858 63.77953\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><text x=\"100.62992125984253\" y=\"83.62204724409449\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--audio); stroke:none;\" transform=\"translate(0,167) scale(1,-1)\">A</text><polyline points=\"76.53543 26.92913, 97.79528 26.92913, 97.79528 55.27559, 114.5197 55.27559\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"119.0551 55.27559, 113.3858 58.11024, 113.3858 52.44094\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><text x=\"100.62992125984253\" y=\"43.93700787401575\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--audio); stroke:none;\" transform=\"translate(0,87) scale(1,-1)\">B</text><polyline points=\"195.5906 60.94488, 216.8504 60.94488, 216.8504 60.94488, 233.5748 60.94488\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"238.1102 60.94488, 232.4409 63.77953, 232.4409 58.11024\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><polyline points=\"314.6457 60.94488, 330.2362 60.94488, 330.2362 60.94488, 341.2913 60.94488\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"345.8268 60.94488, 340.1575 63.77953, 340.1575 58.11024\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/></g></g></svg>\n</div><figcaption>Fig. 4. Ring modulator. Transpone VCO 3 en +5, +7 y +12 semitonos y compara; luego desafina unos cents para obtener batido.</figcaption></figure>\n<aside class=\"note\"><strong class=\"lbl\">Ejercicio</strong> Práctica del manual, adaptada: mutea los osciladores 1–3 en el mixer y deja solo la salida del ring mod. Fija VCO 3 una quinta sobre VCO 1. Luego mueve VCO 1 en semitonos: algunos intervalos suenan consonantes y otros disonantes. Los cents producen batido.</aside>\n<h3>Envíos a efectos: pre y post</h3>\n<p>El hardware tiene un nivel pre-FX y otro post-FX: uno controla cuánta señal entra a la cadena de efectos, el otro cuánto vuelve. Un pre-FX demasiado alto clipea dentro de los efectos aunque el volumen final sea moderado. En VCV la cadena es explícita: ajusta la ganancia antes de cada efecto y usa la perilla MIX de cada uno como balance seco/húmedo.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Parámetro de hardware</th><th>Equivalente en VCV</th></tr></thead><tbody><tr><td>Osc 1/2/3 level, Noise level</td><td>Canales de Mixer / VCV Mixer</td></tr><tr><td>Ring mod 1*3, 2*3 level</td><td>A*B+C (Befaco) → canal del mixer</td></tr><tr><td>Solo</td><td>Mutes</td></tr><tr><td>Pre-FX level</td><td>Ganancia de entrada a la cadena de efectos</td></tr><tr><td>Post-FX level</td><td>Nivel de salida tras efectos / MIX de cada efecto</td></tr></tbody></table></div>"}, {"n": 4, "kick": "TIMBRE", "title": "Filtros", "html": "<p>El filtro atenúa parte del espectro. Es el módulo con más impacto en el carácter de un patch y el principal destino de modulación.</p>\n<h3>Tipos y pendiente</h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Tipo</th><th>Deja pasar</th><th>Sonido</th></tr></thead><tbody><tr><td>Pasa bajos (LP)</td><td>Frecuencias bajo el cutoff</td><td>Cálido, opaco; el estándar sustractivo</td></tr><tr><td>Pasa altos (HP)</td><td>Frecuencias sobre el cutoff</td><td>Delgado; limpia graves, aísla brillo</td></tr><tr><td>Pasa banda (BP)</td><td>Una banda alrededor del cutoff</td><td>Nasal, telefónico, vocal</td></tr><tr><td>Rechaza banda (notch)</td><td>Todo excepto una banda</td><td>Hueco; tipo phaser si se modula</td></tr></tbody></table></div>\n<p>La pendiente mide cuán rápido atenúa el filtro más allá del cutoff: 12 dB/octava (2 polos) suena suave y abierto; 24 dB/octava (4 polos) corta con más decisión. <b>VCF</b> (Fundamental) es un ladder de 4 polos con salidas LPF y HPF simultáneas. Para BP, notch y pendiente seleccionable, <b>VCF</b> de Bogaudio ofrece los cuatro modos.</p>\n<h3>Cutoff y resonancia</h3>\n<p>El cutoff fija dónde empieza la atenuación. La resonancia realimenta la salida del filtro hacia su entrada y crea un pico en torno al cutoff. Con resonancia moderada el barrido del cutoff se vuelve audible y “silbante”. Con resonancia alta el filtro auto-oscila y genera una sinusoide en el cutoff: el filtro se vuelve un oscilador.</p>\n<h4>Drive</h4>\n<p>DRIVE amplifica la entrada antes del núcleo del filtro y lo satura. Agrega armónicos y compresión natural. Conviene compensar el volumen después: más drive, más nivel.</p>\n<h3>Keyboard tracking</h3>\n<p>Con cutoff fijo, las notas agudas suenan más opacas que las graves porque más de sus armónicos quedan sobre el cutoff. El key tracking mueve el cutoff con la nota. Conecta la V/Oct de MIDI-CV a la entrada FREQ del VCF. Como esa entrada suele recibir también la envolvente, suma ambas señales en un mixer antes del VCF (Fig. 5). Con el atenuador FREQ CV al 100 % el cutoff sigue al teclado aproximadamente a 1 V/oct y el timbre se mantiene constante en todo el registro; al 50 % el seguimiento es parcial. Con resonancia auto-oscilante y tracking completo, el filtro se toca como un oscilador afinado.</p>\n<h3>Envolvente de filtro</h3>\n<p>La envolvente que abre y cierra el cutoff en cada nota es la segunda mitad del sonido sustractivo. Un ADSR propio para el filtro, separado del que controla el VCA, da cortes tipo pluck (ataque 0, decay corto, sustain bajo) o barridos lentos (ataque largo). La cantidad de envolvente se controla con el atenuverter FREQ CV del VCF. Un valor negativo invierte la envolvente: el filtro se cierra al tocar.</p>\n<figure class=\"fig\"><div class=\"figscroll\"><svg class=\"fig-svg\" role=\"img\" aria-label=\"Fig. 5. Dos envolventes: ADSR 2 modula el cutoff, ADSR 1 la amplitud. El VCF tiene una sola entrada FREQ: un mixer suma la envolvente y la V/Oct (key tracking) antes de entrar.\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 453 187\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><clipPath id=\"clip6\"><rect x=\"0\" y=\"0\" width=\"453.5433070866142\" height=\"187.08661417322836\"/></clipPath><g id=\"group\" transform=\"scale(1,-1) translate(0,-187)\" style=\"clip-path: url(#clip6)\"><g transform=\"\"><rect x=\"0.0\" y=\"70.86614173228347\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"21.197404035433074\" y=\"92.97637795275591\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,185) scale(1,-1)\">MIDI-CV</text><rect x=\"93.54330708661418\" y=\"150.23622047244095\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"122.85096502829725\" y=\"172.3464566929134\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,344) scale(1,-1)\">VCO</text><text x=\"125.00355291892225\" y=\"157.60629921259843\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,315) scale(1,-1)\">SAW</text><rect x=\"93.54330708661418\" y=\"70.86614173228347\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"116.08592596579726\" y=\"92.97637795275591\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,185) scale(1,-1)\">ADSR 2</text><text x=\"124. 843\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,315) scale(1,-1)\">LPF</text><rect x=\"377.0078740157481\" y=\"150.23622047244095\" width=\"76.53543307086613\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"406.60498508243114\" y=\"172.3464566929134\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,344) scale(1,-1)\">VCA</text><polyline points=\"76.53543 97.79528, 85.03937 97.79528, 85.03937 168.6614, 89.00787 168.6614\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"93.54331 168.6614, 87.87402 171.4961, 87.87402 165.8268\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><text x=\"87.8740157480315\" y=\"136.06299212598427\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--cv); stroke:none;\" transform=\"translate(0,272) scale(1,-1)\">V/Oct</text><polyline points=\"170.0787 168.6614, 225.3543 168.6614, 225.3543 168.6614, 276.0945 168.6614\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"280.6299 168.6614, 274.9606 171.4961, 274.9606 165.8268\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><polyline points=\"357.1654 168.6614, 367.0866 168.6614, 367.0866 168.6614, 372.4724 168.6614\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd;\"/><polygon points=\"377.0079 168.6614, 371.3386 171.4961, 371.3386 165.8268\" style=\"stroke: var(--audio); stroke-linecap: butt; stroke-width: 0.1; fill: var(--audio); fill-rule: evenodd;\"/><polyline points=\"76.53543 86.45669, 85.03937 86.45669, 85.03937 89.29134, 89.00787 89.29134\" style=\"stroke: var(--gate); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"93.54331 89.29134, 87.87402 92.12598, 87.87402 86.45669\" style=\"stroke: var(--gate); stroke-linecap: butt; stroke-width: 0.1; fill: var(--gate); fill-rule: evenodd;\"/><text x=\"87.8740157480315\" y=\"90.70866141732283\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--gate); stroke:none;\" transform=\"translate(0,181) scale(1,-1)\">GATE</text><polyline points=\"76.53543 80.7874, 85.03937 80.7874, 85.03937 26.92913, 89.00787 26.92913\" style=\"stroke: var(--gate); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"93.54331 26.92913, 87.87402 29.76378, 87.87402 24.09449\" style=\"stroke: var(--gate); stroke-linecap: butt; stroke-width: 0.1; fill: var(--gate); fill-rule: evenodd;\"/><polyline points=\"76.53543 92.12598, 85.03937 92.12598, 85.03937 123.3071, 182.5512 123.3071\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"187.0866 123.3071, 181.4173 126.1417, 181.4173 120.4724\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><text x=\"87.8740157480315\" y=\"110.55118110236221\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--cv); stroke:none;\" transform=\"translate(0,221) scale(1,-1)\">key track</text><polyline points=\"170.0787 89.29134, 178.5827 89.29134, 178.5827 134.6457, 182.5512 134.6457\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"187.0866 134.6457, 181.4173 137.4803, 181.4173 131.811\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><polyline points=\"263.622 128.9764, 272.126 128.9764, 272.126 160.1575, 276.0945 160.1575\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"280.6299 160.1575, 274.9606 162.9921, 274.9606 157.3228\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><text x=\"274.96062992125985\" y=\"147.40157480314963\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--cv); stroke:none;\" transform=\"translate(0,294) scale(1,-1)\">FREQ</text><polyline points=\"170.0787 26.92913, 365.6693 26.92913, 365.6693 160.1575, 372.4724 160.1575\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 1.1; fill: None; fill-rule: evenodd; stroke-dasharray: 2, 1.6;\"/><polygon points=\"377.0079 160.1575, 371.3386 162.9921, 371.3386 157.3228\" style=\"stroke: var(--cv); stroke-linecap: butt; stroke-width: 0.1; fill: var(--cv); fill-rule: evenodd;\"/><text x=\"368.503937007874\" y=\"96.37795275590553\" style=\"font-family: var(--f-ui); font-size: 6px;fill: var(--cv); stroke:none;\" transform=\"translate(0,192) scale(1,-1)\">CV</text></g></g></svg>\n</div><figcaption>Fig. 5. Dos envolventes: ADSR 2 modula el cutoff, ADSR 1 la amplitud. El VCF tiene una sola entrada FREQ: un mixer suma la envolvente y la V/Oct (key tracking) antes de entrar.</figcaption></figure>\n<aside class=\"note\"><strong class=\"lbl\">Tip</strong> Para escuchar el efecto de la envolvente de filtro, el cutoff base debe quedar bajo o medio. Con el filtro completamente abierto la envolvente no tiene nada que abrir.</aside>\n<h3>Routing: dos filtros</h3>\n<p>Con dos filtros, el orden de conexión define el resultado. El hardware ofrece configuraciones fijas; en VCV las cableas.</p>\n<div class=\"tablewrap\"><table><thead><tr><th>Configuración</th><th>Cableado</th><th>Resultado</th></tr></thead><tbody><tr><td>Bypass</td><td>Mixer → VCA</td><td>Sin filtrado</td></tr><tr><td>Single</td><td>Mixer → VCF 1 → VCA</td><td>Un solo filtro</td></tr><tr><td>Serie</td><td>Mixer → VCF 1 → VCF 2 → VCA</td><td>Pendientes acumuladas; LP + HP = pasa banda variable</td></tr><tr><td>Paralelo</td><td>Mixer → VCF 1 y VCF 2 → Mixer → VCA</td><td>Dos timbres sumados; LP + HP con huecos = formantes</td></tr><tr><td>Paralelo 2</td><td>VCO 3 + ruido → VCF 1; resto → VCF 2</td><td>Cada fuente con su propio filtro</td></tr><tr><td>Drum</td><td>Como paralelo 2, VCF 1 alimenta además VCF 2</td><td>Capas encadenadas para percusión</td></tr></tbody></table></div>\n<figure class=\"fig\"><div class=\"figscroll\"><svg class=\"fig-svg\" role=\"img\" aria-label=\"Fig. 6. Filtros en paralelo. El balance del hardware es la proporción entre los dos canales del mixer final.\" preserveAspectRatio=\"xMinYMin meet\" viewBox=\"0 0 453 130\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.0\" fill-rule=\"evenodd\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><clipPath id=\"clip7\"><rect x=\"0\" y=\"0\" width=\"453.5433070866142\" height=\"130.3937007874016\"/></clipPath><g id=\"group\" transform=\"scale(1,-1) translate(0,-130)\" style=\"clip-path: url(#clip7)\"><g transform=\"\"><rect x=\"0.0\" y=\"53.85826771653545\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--ink); stroke-linecap: butt; stroke-width: 0.8; fill: var(--surface); fill-rule: evenodd;\"/><text x=\"26.281388410433074\" y=\"75.9685039370079\" style=\"font-family: var(--f-ui); font-weight: 700; font-size: 7.6px;fill: var(--ink); stroke:none;\" transform=\"translate(0,151) scale(1,-1)\">Mixer</text><text x=\"27.166324933870573\" y=\"61.22834645669293\" style=\"font-family: var(--f-ui); font-size: 5.9px;fill: var(--muted); stroke:none;\" transform=\"translate(0,122) scale(1,-1)\">fuentes</text><rect x=\"113.38582677165356\" y=\"93.54330708661419\" width=\"76.53543307086615\" height=\"36.85039370078741\" rx=\"2\" ry=\"2\" style=\"stroke: var(--i
